<style>
:root{
  --bg:#07080a;--bg2:#0f1114;--panel:#14171b;--panel2:#1b1f25;--line:#262b33;
  --txt:#f2f4f7;--mut:#8b95a2;--mut2:#b8c0ca;--acc:#ff5a00;--accb:#e04e00;--acc2:#ff7a2e;--ok:#22c55e;--warn:#f5b301;--bad:#ef4444;--blue:#2563eb;
  --g1:#22c55e;--g2:#84cc16;--g3:#eab308;--g4:#f59e0b;--g5:#f97316;--g6:#ef4444;--g7:#d946ef;
  --r:10px;--rs:8px;--sh:0 10px 30px rgba(0,0,0,.4);
  --disp:'Barlow Condensed','Arial Narrow',Inter,sans-serif;
  --checker:repeating-conic-gradient(#f2f4f7 0 25%,#07080a 0 50%) 0 0/10px 10px;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
[data-theme=light]{
  --bg:#eef1f4;--bg2:#e4e8ed;--panel:#ffffff;--panel2:#f3f5f8;--line:#d9dfe6;
  --txt:#111419;--mut:#5d6874;--mut2:#3e4955;--sh:0 8px 24px rgba(20,30,40,.10);
  --checker:repeating-conic-gradient(#111 0 25%,#eef1f4 0 50%) 0 0/10px 10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase}
.sp{flex:1}
.mut{color:var(--mut)}

main{max-width:720px;margin:0 auto;padding:calc(18px + var(--safeT)) 16px calc(100px + var(--safeB))}
body.notab main{padding-bottom:calc(40px + var(--safeB))}
.scr{display:none}.scr.act{display:block}

/* basic controls */
.ib{width:44px;height:44px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--txt);flex:none}
.ib:hover{border-color:var(--acc)}
.ib.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);font-family:var(--disp);font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap;color:var(--txt)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--accb);border-color:var(--accb);color:#fff}
.btn.pri::after{content:"";position:absolute;right:-14px;top:0;bottom:0;width:40px;background:rgba(255,255,255,.16);transform:skewX(-18deg)}
.btn.pri:hover{background:var(--acc)}
.btn.bad{color:var(--bad)}
.btn.sm{height:40px;padding:0 13px;font-size:16px}
.btn.icon{width:48px;padding:0;flex:none}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.07em}
.in{width:100%;height:50px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);padding:0 14px;outline:none;font-size:16px}
.in:focus{border-color:var(--acc)}
.in[readonly]{color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mut2);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--rs);background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mut)}
.pill svg{width:15px;height:15px}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kick{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--acc2);text-transform:uppercase}
.kick::before{content:"";width:30px;height:10px;background:var(--checker)}
h1{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;margin:0;letter-spacing:.005em}
h2{font-family:var(--disp);font-style:italic;font-size:21px;margin:24px 0 10px;font-weight:800;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
h2 a,h2 button.link{margin-left:auto;font-family:Inter;font-style:normal;font-size:13px;font-weight:600;text-transform:none;color:var(--acc2);background:none;border:0;cursor:pointer;padding:8px 0}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.head h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:30px}
.empty{padding:24px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.localbar{background:rgba(245,179,1,.10);border:1px solid rgba(245,179,1,.35);color:var(--warn);padding:10px 12px;border-radius:var(--rs);font-size:13px;font-weight:600;margin-bottom:14px}
.note-warn{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--mut);line-height:1.5;margin-top:22px}
.note-warn svg{color:var(--warn);margin-top:1px;width:18px;height:18px}

/* avatar */
.av{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--disp);font-style:italic;font-weight:900;font-size:20px;color:var(--txt);text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:38px;height:38px;font-size:17px}
.av.xl{width:112px;height:112px;font-size:48px;border:3px solid var(--acc)}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);border-top:1px solid var(--line);padding:6px 8px calc(8px + var(--safeB))}
#tabbar .in2{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#tabbar button{height:56px;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;cursor:pointer}
#tabbar button svg{width:23px;height:23px}
#tabbar button.on{color:var(--acc2);font-weight:800}

/* landing */
#scr-landing{margin:calc(-18px - var(--safeT)) -16px 0}
.land{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#07080a;color:#f2f4f7}
.land .art{position:relative;flex:1 1 auto;min-height:150px;width:100%;max-width:560px;margin:-8px auto -30px}
.land .art svg{position:absolute;inset:0}
.land .art{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 80%,transparent 100%)}
.land .art svg{width:100%;height:100%}
.land .ltop{position:relative;display:flex;align-items:center;gap:10px;padding:calc(18px + var(--safeT)) 20px 0;max-width:560px;width:100%;margin:0 auto}
.logo{width:38px;height:38px;border-radius:9px;flex:none}
.wm{font-family:var(--disp);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1}
.wm b{color:var(--acc)}
.langpill{height:38px;border-radius:19px;border:1px solid rgba(242,244,247,.22);background:rgba(7,8,10,.6);color:#f2f4f7;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.land .lbody{position:relative;flex:none;padding:0 20px calc(24px + var(--safeB));display:flex;flex-direction:column;gap:18px;max-width:560px;width:100%;margin-left:auto;margin-right:auto}
.land h1{font-size:clamp(48px,13.5vw,72px);line-height:.88;color:#f2f4f7}
.land h1 span{color:var(--acc)}
.land p{margin:0;font-size:16px;line-height:1.5;color:#b8c0ca;max-width:330px}
.land .kick::before{background:repeating-conic-gradient(#f2f4f7 0 25%,#07080a 0 50%) 0 0/10px 10px}
.minifeat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.minifeat div{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r);background:rgba(20,23,27,.85);border:1px solid #262b33;font-size:12px;font-weight:600;line-height:1.3;color:#f2f4f7}
.minifeat svg{color:var(--acc2)}
.land .btn.pri{height:58px;font-size:24px;border-radius:var(--r)}
.chkline{display:flex;align-items:center;gap:10px;font-size:12px;color:#8b95a2}
.chkline::before,.chkline::after{content:"";flex:1;height:6px;background:repeating-conic-gradient(#f2f4f7 0 25%,#07080a 0 50%) 0 0/6px 6px;opacity:.45}
.chkline b{color:#f2f4f7}
.install{font-size:12px;color:#8b95a2;text-align:center;line-height:1.4}

/* login */
.login{display:flex;flex-direction:column;min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px);max-width:440px;margin:0 auto}
.login .lhead{display:flex;flex-direction:column;gap:8px;margin:22px 0 10px}
.login h1{font-size:46px}
.login .actions2{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:24px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.linkbtn{height:44px;border:0;background:none;color:var(--acc2);font-weight:600;font-size:14px;cursor:pointer}
.credit{text-align:center;color:var(--mut);font-size:12px;margin-top:22px}
.credit b{color:var(--txt)}

/* home */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.hello .t small{display:block;font-size:13px;color:var(--mut)}
.hello .t b{display:block;font-family:var(--disp);font-style:italic;font-weight:900;font-size:28px;line-height:1;text-transform:uppercase}
.hello .av{cursor:pointer}
.navcard{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:22px 20px;border-radius:14px;background:var(--accb);border:0;color:#fff;text-align:left;cursor:pointer}
.navcard::after{content:"";position:absolute;right:-24px;top:0;bottom:0;width:70px;background:rgba(255,255,255,.18);transform:skewX(-18deg)}
.navcard svg{width:30px;height:30px}
.navcard b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:40px;line-height:1;text-transform:uppercase}
.navcard span{font-size:14px;opacity:.95}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{height:94px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt)}
.tile svg{width:25px;height:25px;color:var(--acc2)}
.tile:hover{border-color:var(--acc)}
.stage{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);cursor:pointer;margin-bottom:8px}
.stage:hover{border-color:var(--acc)}
.stage .bar{width:6px;height:38px;border-radius:3px;background:var(--acc);flex:none}
.stage .t{flex:1;min-width:0}
.stage .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:15px}
.stage .t span{font-size:12px;color:var(--mut)}
.chev{color:var(--mut)}
.cc{width:40px;height:30px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--disp);font-style:italic;font-weight:900;font-size:16px;flex:none}
.libcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;text-align:left}
.libcard:hover{border-color:var(--acc)}
.libcard .ic{width:46px;height:46px;border-radius:var(--rs);background:repeating-conic-gradient(#f2f4f7 0 25%,#111 0 50%) 0 0/12px 12px;flex:none;border:2px solid var(--acc)}
.libcard b{display:block;font-family:var(--disp);font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;line-height:1}
.libcard span{font-size:13px;color:var(--mut)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat small{display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--disp);font-style:italic;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}

/* maps */
.map{position:relative;isolation:isolate;z-index:0;height:50vh;min-height:300px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:#181b20}
.leaflet-container{font-family:inherit;background:#181b20}
[data-theme=light] .leaflet-container,[data-theme=light] .map{background:#e8ecf0}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:var(--rs)!important;box-shadow:var(--sh)!important;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{width:40px!important;height:40px!important;line-height:40px!important;background:var(--panel)!important;color:var(--txt)!important;border-bottom:1px solid var(--line)!important;font:700 20px/40px Inter,sans-serif!important}
.leaflet-bar a:last-child{border-bottom:0!important}
.leaflet-control-attribution{background:rgba(10,11,13,.55)!important;color:#cfd6de!important;font-size:10px!important;border-radius:var(--rs) 0 0 0}
.leaflet-control-attribution a{color:#fff!important}
.mapsw{position:relative}
.mapsw>button{width:40px;height:40px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel);color:var(--txt);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh)}
.mapsw>button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mapmenu{position:absolute;right:0;top:46px;min-width:170px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:var(--rs);box-shadow:var(--sh);padding:4px;display:grid;gap:2px}
.mapmenu button{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--txt);font-family:var(--disp);font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;cursor:pointer;text-align:left}
.mapmenu button:hover{background:var(--panel2)}
.mapmenu button.on{background:rgba(255,90,0,.15);color:var(--acc)}
.mapmenu i{width:26px;height:18px;border-radius:3px;border:1px solid var(--line);flex:none}
.sw-auto{background:linear-gradient(135deg,#1d2127 50%,#e9edf1 50%)}.sw-dark{background:#1d2127}.sw-streets{background:#e9e4d8}.sw-sat{background:linear-gradient(135deg,#355a2c,#6b7a4a 50%,#2b4a5e)}.sw-hybrid{background:linear-gradient(135deg,#355a2c,#6b7a4a 50%,#2b4a5e);box-shadow:inset 0 0 0 2px #f5d34a}.sw-topo{background:linear-gradient(135deg,#cfe3b4,#e9d9a8 60%,#c9a36b)}
.wp-ic{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.flag-ic{width:28px;height:28px;border-radius:6px;border:2px solid #fff;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/10px 10px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.nm{display:flex;align-items:center;justify-content:center;min-width:28px;height:20px;padding:0 5px;border-radius:4px;color:#111;font-family:var(--disp);font-style:italic;font-weight:900;font-size:14px;border:1.5px solid rgba(0,0,0,.6);box-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;transform:translate(-50%,-50%)}
.me-ic{width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.25)}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.panelbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.results{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:-4px 0 10px;overflow:hidden}
.results div{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.results div:last-child{border-bottom:0}
.results div:hover{background:var(--panel2)}
.results small{display:block;color:var(--mut);font-size:12px}

/* stage notes */
.layout2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.notes{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.nrow{display:grid;grid-template-columns:38px 58px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.nrow:last-child{border-bottom:0}
.nrow:hover,.nrow.sel{background:var(--panel2)}
.nrow .k{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.gb{display:inline-flex;align-items:center;justify-content:center;gap:3px;height:32px;min-width:54px;padding:0 6px;border-radius:var(--rs);font-family:var(--disp);font-style:italic;font-weight:900;color:#111;font-size:21px}
.gb svg{width:17px;height:17px;stroke:#111;stroke-width:2.8}
.gb.blue{background:var(--blue);color:#fff}.gb.blue svg{stroke:#fff}
.nrow .tx{font-weight:700;font-size:14px;min-width:0}
.nrow .tx span{display:block;font-size:12px;color:var(--mut);font-weight:500}
.nrow .gp{font-family:var(--disp);font-style:italic;font-weight:900;font-size:19px;color:var(--acc2)}
.c1{background:var(--g1)}.c2{background:var(--g2)}.c3{background:var(--g3)}.c4{background:var(--g4)}.c5{background:var(--g5)}.c6{background:var(--g6)}.c7{background:var(--g7)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1500;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:16px 16px 0 0;padding:18px 16px;padding-bottom:calc(18px + var(--safeB));max-height:90vh;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 4px;font-family:var(--disp);font-style:italic;font-weight:900;font-size:28px;text-transform:uppercase}
.seg{display:grid;gap:6px}
.seg button{height:44px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel2);font-family:var(--disp);font-style:italic;font-weight:800;font-size:16px;text-transform:uppercase;cursor:pointer;color:var(--txt)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:var(--rs);border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:rgba(255,90,0,.16);border-color:var(--acc);color:var(--acc)}

/* profile */
.pcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(115deg,var(--accb) 0 70%,transparent 70% 73%,#f2f4f7 73% 75%,transparent 75%)}
.pcard .avbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;margin-top:10px}
.pcard .cam{position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--accb);color:#fff;display:grid;place-items:center;border:3px solid var(--panel)}
.pcard .cam svg{width:18px;height:18px}
.pcard b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:28px;text-transform:uppercase;line-height:1}
.veh{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);margin-bottom:8px}
.veh .ic{width:40px;height:40px;border-radius:var(--rs);background:rgba(255,90,0,.14);color:var(--acc2);display:grid;place-items:center;flex:none}
.veh .t{flex:1;min-width:0}.veh .t b{display:block;font-weight:700}.veh .t span{font-size:12px;color:var(--mut)}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:21px;text-transform:uppercase;min-width:0;line-height:1}
.vrow .ib{width:40px;height:40px}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.vdot.on{background:var(--ok)}
.vadd{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px}
.vadd .full{grid-column:1/-1}
.acclist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.acclist button{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--txt);font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.acclist button:last-child{border-bottom:0}
.acclist button:hover{background:var(--panel2)}
.acclist button.bad{color:var(--bad)}
.acclist .chev{margin-left:auto}

/* admin */
.urow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow .t{flex:1;min-width:150px}
.urow .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.urow .t span{font-size:12px;color:var(--mut)}
.urow .acts{display:flex;gap:6px;width:100%;padding-left:50px}
.badge{height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.badge.on{background:rgba(34,197,94,.14);color:#4ade80}.badge.off{background:var(--panel2);color:var(--mut2)}.badge.adm{background:rgba(255,90,0,.14);color:var(--acc2)}
.listcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}

/* drive */
#scr-drive{position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--txt);display:none;flex-direction:column}
#scr-drive.act{display:flex}
.dtop{padding:calc(10px + var(--safeT)) 10px 8px}
.topcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:150px;padding:14px 16px;border-radius:16px;color:#111;cursor:pointer;border:0;width:100%;text-align:left}
.topcard::after{content:"";position:absolute;right:-26px;top:0;bottom:0;width:76px;background:rgba(255,255,255,.22);transform:skewX(-18deg)}
.topcard .ar svg{width:84px;height:84px;stroke:#111;stroke-width:2.6}
.topcard .gr{font-family:var(--disp);font-style:italic;font-weight:900;font-size:124px;line-height:.78;letter-spacing:-.02em}
.topcard .gr.h{font-size:64px;line-height:.9}
.topcard .col{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;z-index:1}
.topcard .md{font-family:var(--disp);font-style:italic;font-weight:900;font-size:28px;line-height:.95;text-transform:uppercase}
.topcard .ds{font-family:var(--disp);font-style:italic;font-weight:900;font-size:38px;line-height:1}
.topcard.blue{background:var(--blue);color:#fff}
.topcard.blue .ar svg{stroke:#fff}
.topcard.blue .md{font-family:Inter;font-style:normal;font-weight:700;font-size:17px;text-transform:none;line-height:1.25}
.topcard.idle{background:var(--panel);border:1px solid var(--line);color:var(--mut);justify-content:center}
.topcard.idle::after{display:none}
.topcard.idle .gr{font-size:70px}
.dprog{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:8px}
.dprog i{display:block;height:100%;width:0;background:var(--acc)}
.dmap{position:relative;flex:1;min-height:140px;margin:0 10px}
.dmap .rotwrap{position:absolute;inset:0;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:#181b20;isolation:isolate;z-index:0}
.dmap #mapDr{position:absolute;left:50%;top:50%;width:var(--d,140%);height:var(--d,140%);min-height:0;border:0;border-radius:0;transform:translate(-50%,-50%) rotate(var(--rot,0deg));transition:transform .45s linear}
.dctl{position:absolute;right:8px;top:8px;z-index:500;display:flex;flex-direction:column;gap:6px}
.dctl .ib{box-shadow:var(--sh)}
.dctl .mapmenu{right:50px;top:0}
.dattr{position:absolute;right:6px;bottom:4px;z-index:500;font-size:9px;color:#cfd6de;background:rgba(10,11,13,.5);padding:1px 5px;border-radius:4px;pointer-events:none}
.me-nav{width:34px;height:34px;display:grid;place-items:center;transition:transform .45s linear}
.me-nav svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.dmap .dstat{position:absolute;left:8px;bottom:8px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.dmap .dstat .pill{background:var(--panel);box-shadow:var(--sh)}
.dmap .dmute{position:absolute;right:8px;bottom:22px;z-index:500;box-shadow:var(--sh)}
.dmap .offroute{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:500;background:var(--bad);color:#fff;font-family:var(--disp);font-style:italic;font-weight:900;font-size:22px;text-transform:uppercase;border-radius:var(--rs);padding:6px 14px;white-space:nowrap}
.dbottom{padding:10px 10px calc(12px + var(--safeB));display:flex;flex-direction:column;gap:10px}
.dnext{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);min-height:66px}
.dnext .lab{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;writing-mode:vertical-rl;transform:rotate(180deg)}
.dnext .t{flex:1;min-width:0}
.dnext .t b{display:block;font-family:var(--disp);font-style:italic;font-weight:900;font-size:22px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnext .t span{display:block;font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow{display:flex;align-items:center;gap:8px}
.d3{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;min-width:0}
.d3 small{display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.d3 b small{display:inline;letter-spacing:0;text-transform:none;font-size:.58em;color:var(--mut);margin-left:2px}
.d3 b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:clamp(17px,5.2vw,24px);white-space:nowrap;font-variant-numeric:tabular-nums}
.dbtn{width:54px;height:54px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--txt);display:grid;place-items:center;cursor:pointer;flex:none}
.dbtn.pri{background:var(--accb);border-color:var(--accb);color:#fff}
.dbtn svg{width:26px;height:26px}
.simbar{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:13px;font-weight:700}
.simbar input{flex:1;accent-color:var(--acc)}

#toast{position:fixed;left:50%;bottom:calc(96px + var(--safeB));transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b1f25;color:#fff;border:1px solid #2d333c;border-left:4px solid var(--acc);padding:10px 16px;border-radius:var(--rs);font-weight:600;font-size:14px;box-shadow:var(--sh);max-width:90vw}
#toast div.ok{border-left-color:var(--ok)}#toast div.bad{border-left-color:var(--bad)}

@media(min-width:900px){main{max-width:1000px}}
@media(max-width:760px){.layout2{grid-template-columns:1fr}.notes{max-height:none}.map{height:46vh}}

/* ===================== VERSIÓN WEB (escritorio) ===================== */
.sbrand,.scredit{display:none}
@media(min-width:1000px){
  html,body{font-size:15px}
  /* menú lateral */
  #tabbar{top:0;bottom:0;right:auto;width:250px;border-top:0;border-right:1px solid var(--line);padding:26px 14px;display:flex;flex-direction:column;gap:22px}
  #tabbar.hidden{display:none!important}
  .sbrand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .sbrand .wm{font-size:26px}
  #tabbar .in2{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0}
  #tabbar button{flex-direction:row;justify-content:flex-start;gap:14px;height:50px;padding:0 14px;border-radius:var(--rs);font-size:15px;font-weight:600}
  #tabbar button:hover{background:var(--panel)}
  #tabbar button.on{background:rgba(255,90,0,.12);color:var(--acc2)}
  .scredit{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding:0 8px;font-size:12px;color:var(--mut)}
  .scredit b{color:var(--txt)}
  body:not(.notab) main{margin-left:250px;max-width:1180px;padding:36px 44px 48px}
  body.notab main{max-width:1240px;padding:32px 40px 48px}
  #toast{bottom:28px}
  h1{font-size:44px}.head h1{font-size:40px}
  .head{margin-bottom:22px}

  /* portada */
  #scr-landing{margin:-32px -40px 0}
  .land{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:auto 1fr;min-height:100vh}
  .land .ltop{grid-column:1/-1;grid-row:1;z-index:2;max-width:none;padding:28px 48px 0}
  .land .lbody{grid-column:1;grid-row:2;z-index:2;align-self:center;max-width:640px;width:100%;margin:0 0 0 auto;padding:0 32px 60px 56px;gap:22px}
  .land .art{grid-column:2;grid-row:1/3;margin:0;max-width:none;height:100%;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 22%,#000 100%);mask-image:linear-gradient(to right,transparent 0,#000 22%,#000 100%)}
  .land h1{font-size:clamp(64px,5.8vw,96px)}
  .land p{font-size:18px;max-width:440px}
  .land .btn.pri{max-width:360px}
  .chkline{max-width:440px}
  .install{text-align:left}

  /* acceso */
  #scr-login.act{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 80px)}
  .login{min-height:0;width:440px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:16px;padding:28px 30px 22px;box-shadow:var(--sh)}
  .login h1{font-size:46px}
  .login .in{background:var(--bg2)}

  /* inicio piloto */
  .hello{margin-bottom:26px}
  .hello .t b{font-size:38px}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .hcol2 h2{margin-top:0}
  .navcard{padding:30px 28px;min-height:200px;justify-content:flex-end}
  .navcard b{font-size:56px}
  .tiles{gap:12px}.tile{height:110px;font-size:14px}

  /* listas de tramos */
  #stageList,#admStageList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #stageList .stage,#admStageList .stage{margin:0}
  #stageList .empty,#admStageList .empty{grid-column:1/-1}

  /* perfil */
  .pgrid{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"left right" "acc right";gap:0 32px;align-items:start}
  .pleft{grid-area:left}.pright{grid-area:right}.pacc{grid-area:acc}
  .pright>label.f:first-child{margin-top:0}
  .pacc .credit{text-align:left}
  .vrow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:21px;text-transform:uppercase;min-width:0;line-height:1}
.vrow .ib{width:40px;height:40px}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.vdot.on{background:var(--ok)}
.vadd{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:end}
  .vadd .full:first-child{grid-column:auto}
  .vadd .btn.full{grid-column:auto;margin-top:0!important}

  /* panel administrador */
  #scr-panel .stats{gap:14px;margin-bottom:16px}
  #scr-panel .stat{padding:18px 20px}
  #scr-panel .stat b{font-size:48px}
  #scr-panel>.row{max-width:520px}
  #admRecent:empty{display:none}
  .urow{flex-wrap:nowrap}
  .urow .acts{width:auto;padding-left:0}

  /* navegador (configuración) */
  #scr-nav.act{display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:auto auto auto auto auto 1fr;gap:0 24px}
  #scr-nav .head{grid-column:1;grid-row:1}
  #scr-nav .searchbar{grid-column:1;grid-row:2}
  #scr-nav .results{grid-column:1;grid-row:3;margin-top:0}
  #scr-nav .panelbar{grid-column:1;grid-row:4}
  #scr-nav>.row{grid-column:1;grid-row:5;flex-direction:column;align-items:stretch;gap:10px;margin-top:14px!important}
  #scr-nav>.row .btn{flex:none!important;height:56px}
  #scr-nav #mapNav{grid-column:2;grid-row:1/7;height:calc(100vh - 84px);min-height:520px}

  /* editor / grabación / tramo */
  #mapEd,#mapRec{height:62vh}
  #scr-record .stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  #scr-editor .btn.pri.block,#scr-record>.row{max-width:520px;margin-left:auto}
  #mapSt{height:58vh}
  .layout2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
  .notes{max-height:calc(58vh + 108px)}

  /* conducción */
  #scr-drive.act{display:grid;grid-template-columns:440px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0}
  #scr-drive .dtop{grid-column:1;grid-row:1;padding:20px 16px 10px 20px}
  #scr-drive .dbottom{grid-column:1;grid-row:2;align-self:start;padding:6px 16px 20px 20px;gap:14px}
  #scr-drive .dmap{grid-column:2;grid-row:1/3;margin:20px 20px 20px 4px}
  .topcard{min-height:240px}
  .topcard{gap:12px}
  .topcard .ar svg{width:88px;height:88px}
  .topcard .gr{font-size:136px}
  .topcard .md{font-size:28px}
  .topcard .ds{font-size:42px;white-space:nowrap}
  .topcard.blue .md{font-size:20px}
  .dnext{min-height:84px}
  .dnext .t b{font-size:26px}
  .d3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .d3 b{font-size:30px}
  .drow{flex-wrap:wrap}
  .drow .d3{flex:1 1 100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  .drow .dbtn{flex:1;width:auto;height:60px}
}
</style>
</head>

<section id="scr-drive">
  <div class="dtop">
    <button class="topcard idle" id="drTop" data-ti="repeat"></button>
    <div class="dprog"><i id="drProg"></i></div>
  </div>
  <div class="dmap">
    <div class="rotwrap" id="drRot"><div class="map" id="mapDr"></div></div>
    <div class="dctl">
      <button class="ib" id="drHead" data-ti="headUp"></button>
      <button class="ib" id="drLayers" data-ti="mapStyle" data-i="layers"></button>
      <button class="ib" id="drZin" aria-label="+" data-i="plus"></button>
      <button class="ib" id="drZout" aria-label="-" data-i="minus"></button>
    </div>
    <div class="dattr">© Esri · OSM</div>
    <div class="dstat"><span class="pill" id="drMode"></span><span class="pill" id="drGps"></span></div>
    <button class="ib dmute" id="drRepeat" data-ti="repeat" data-i="repeat" style="bottom:74px"></button>
    <button class="ib dmute" id="drMute" data-i="vol"></button>
    <div id="drOff" class="offroute hidden" data-t="offroute"></div>
  </div>
  <div class="dbottom">
    <div class="dnext" id="drNext"></div>
    <div class="simbar hidden" id="drSimBar"><span data-t="simulation"></span><input type="range" id="drSimSpd" min="20" max="160" step="5" value="80"><b id="drSimVal">80 km/h</b></div>
    <div class="drow">
      <div class="d3">
        <div><small data-t="speed"></small><b id="drSpd">0</b></div>
        <div><small id="drLeftL"></small><b id="drLeft">—</b></div>
        <div><small data-t="curve"></small><b id="drIdx">—</b></div>
      </div>
      <button class="dbtn pri" id="drGo"></button>
      <button class="dbtn" id="drExit" data-i="close"></button>
    </div>
  </div>
</section>

<!-- HOJA NOTA -->
<div class="ov hidden" id="ovNote"><div class="sheet">
  <h3 id="nsTitle"></h3><div class="mut" id="nsSub" style="font-size:13px"></div>
  <label class="f" data-t="dir"></label>
  <div class="seg" style="grid-template-columns:1fr 1fr" id="nsDir"><button data-v="L" data-t="dirL"></button><button data-v="R" data-t="dirR"></button></div>
  <label class="f" data-t="grade"></label>
  <div class="seg" style="grid-template-columns:repeat(7,1fr)" id="nsGrade"></div>
  <label class="f" data-t="details"></label>
  <div class="chips" id="nsMods"></div>
  <div class="row" style="margin-top:18px">
    <button class="btn sm" id="nsSay"><span data-i="vol"></span><span data-t="listen"></span></button>
    <button class="btn sm bad" id="nsDel"><span data-i="trash"></span><span data-t="remove"></span></button>
    <div class="sp"></div>
    <button class="btn pri sm" id="nsOk" data-t="done"></button>
  </div>
</div></div>

<!-- HOJA AJUSTES -->
<div class="ov hidden" id="ovSet"><div class="sheet">
  <h3 data-t="settings"></h3>

  <select class="in" data-lang></select>
  <label class="f" data-t="theme"></label>
  <div class="seg" style="grid-template-columns:1fr 1fr" id="setTheme"><button data-v="dark" data-t="night"></button><button data-v="light" data-t="day"></button></div>
  <label class="f" data-t="mapStyle"></label>
  <div class="seg" style="grid-template-columns:repeat(3,1fr)" id="setMap"></div>
  <label class="f" data-t="awakeL"></label>
  <div class="seg" style="grid-template-columns:1fr 1fr" id="setAwake"><button data-v="1" data-t="on1"></button><button data-v="0" data-t="off1"></button></div>
  <label class="f" data-t="mapOrient"></label>
  <div class="seg" style="grid-template-columns:1fr 1fr" id="setHead"><button data-v="1" data-t="headUp"></button><button data-v="0" data-t="northUp"></button></div>
  <label class="f" data-t="scale"></label>
  <div class="seg" style="grid-template-columns:1fr 1fr" id="setScale"><button data-v="1fast" data-t="s1"></button><button data-v="6fast" data-t="s6"></button></div>
  <label class="f" data-t="calib"></label>
  <div class="seg" style="grid-template-columns:repeat(3,1fr)" id="setCalib"><button data-v="1.2" data-t="prud"></button><button data-v="1" data-t="norm"></button><button data-v="0.85" data-t="bold"></button></div>
  <label class="f"><span data-t="lead"></span>: <span id="setLeadV"></span></label>
  <input type="range" id="setLead" min="3" max="9" step="0.5" style="width:100%;accent-color:var(--acc)">
  <label class="f"><span data-t="rate"></span>: <span id="setRateV"></span></label>
  <input type="range" id="setRate" min="0.8" max="1.6" step="0.05" style="width:100%;accent-color:var(--acc)">

  <div class="seg" style="grid-template-columns:1fr 1fr" id="setVStyle"><button data-v="rally" data-t="styleRally"></button><button data-v="normal" data-t="styleNormal"></button></div>
  <label class="f" data-t="voice"></label>
  <select class="in" id="setVoice"></select>
  <div class="mut" style="font-size:12px;margin-top:6px;line-height:1.45" data-t="voiceHint"></div>
  <div class="row" style="margin-top:18px"><button class="btn sm" id="setTest"><span data-i="vol"></span><span data-t="test"></span></button><div class="sp"></div><button class="btn pri sm" id="setOk" data-t="done"></button></div>
</div></div>

const RE=6371000, D2R=Math.PI/180;
function hav(a,b){const dl=(b[0]-a[0])*D2R,dn=(b[1]-a[1])*D2R;const x=Math.sin(dl/2)**2+Math.cos(a[0]*D2R)*Math.cos(b[0]*D2R)*Math.sin(dn/2)**2;return 2*RE*Math.asin(Math.sqrt(x));}
const fmtKm=m=>m>=1000?(m/1000).toFixed(m>=10000?1:2).replace('.',cfg.lang==='en'?'.':',')+' km':Math.round(m)+' m';
const fmtMin=s=>s>=3600?`${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`:`${Math.max(1,Math.round(s/60))} min`;
const fmtDate=ts=>ts?new Date(ts).toLocaleDateString(VLANG[cfg.lang],{day:'2-digit',month:'short',year:'numeric'}):'';
function encNum(v){v=v<0?~(v<<1):(v<<1);let s='';while(v>=0x20){s+=String.fromCharCode((0x20|(v&0x1f))+63);v>>=5;}return s+String.fromCharCode(v+63);}
function encodePoly(pts){let o='',pa=0,po=0;for(const [a,b] of pts){const A=Math.round(a*1e5),B=Math.round(b*1e5);o+=encNum(A-pa)+encNum(B-po);pa=A;po=B;}return o;}
function decodePoly(s){const pts=[];let i=0,a=0,b=0;while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,c;do{c=s.charCodeAt(i++)-63;r|=(c&0x1f)<<sh;sh+=5;}while(c>=0x20);const d=(r&1)?~(r>>1):(r>>1);if(k===0)a+=d;else b+=d;}pts.push([a/1e5,b/1e5]);}return pts;}

/* =========================================================
   MOTOR DE NOTAS
   Escala interna: 1 = más rápida … 6 = más lenta, 7 = horquilla
   ========================================================= */
const STEP=5;
function buildRoute(rawPts,source){
  const pts=[rawPts[0]];
  for(const p of rawPts) if(hav(pts[pts.length-1],p)>0.8) pts.push(p);
  if(pts.length<2) throw new Error(t('shortRoute'));
  const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length, lon0=pts.reduce((a,p)=>a+p[1],0)/pts.length, c0=Math.cos(lat0*D2R);
  const toXY=(la,lo)=>[(lo-lon0)*D2R*RE*c0,(la-lat0)*D2R*RE];
  const toLL=(x,y)=>[lat0+y/(RE*D2R),lon0+x/(RE*D2R*c0)];
  const P=pts.map(p=>toXY(p[0],p[1]));
  const X=[P[0][0]],Y=[P[0][1]];let carry=0;
  for(let i=1;i<P.length;i++){
    const [ax,ay]=P[i-1],[bx,by]=P[i];const Ls=Math.hypot(bx-ax,by-ay);if(Ls<1e-6)continue;
    let u=STEP-carry;while(u<=Ls){X.push(ax+(bx-ax)*u/Ls);Y.push(ay+(by-ay)*u/Ls);u+=STEP;}
    carry=Ls-(u-STEP);
  }
  const last=P[P.length-1];if(carry>STEP*0.4){X.push(last[0]);Y.push(last[1]);}
  const n=X.length;
  const w=(source==='map'||source==='nav'||source==='circuit')?1:2;
  let Xs=X.slice(),Ys=Y.slice();
  for(let pass=0;pass<2;pass++){
    const nx=[],ny=[];
    for(let i=0;i<n;i++){let sx=0,sy=0,c=0;for(let j=Math.max(0,i-w);j<=Math.min(n-1,i+w);j++){sx+=Xs[j];sy+=Ys[j];c++;}nx.push(sx/c);ny.push(sy/c);}
    nx[0]=X[0];ny[0]=Y[0];nx[n-1]=X[n-1];ny[n-1]=Y[n-1];Xs=nx;Ys=ny;
  }
  const H=[];for(let i=0;i<n-1;i++)H.push(Math.atan2(Ys[i+1]-Ys[i],Xs[i+1]-Xs[i]));
  for(let i=1;i<H.length;i++){while(H[i]-H[i-1]>Math.PI)H[i]-=2*Math.PI;while(H[i]-H[i-1]<-Math.PI)H[i]+=2*Math.PI;}
  // curvatura por circunferencia que pasa por 3 puntos separados ±15 m (más precisa que la diferencia de rumbos)
  const h=3,K0=new Array(n).fill(0),K=new Array(n).fill(0);
  for(let i=h;i<n-h;i++){
    const ax=Xs[i-h],ay=Ys[i-h],bx=Xs[i],by=Ys[i],cx=Xs[i+h],cy=Ys[i+h];
    const cr=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
    const ab=Math.hypot(bx-ax,by-ay),bc=Math.hypot(cx-bx,cy-by),ca=Math.hypot(ax-cx,ay-cy);
    const den=ab*bc*ca;K0[i]=den>1e-6?2*cr/den:0;
  }
  for(let i=0;i<n;i++){let s=0,c=0;for(let j=Math.max(0,i-1);j<=Math.min(n-1,i+1);j++){s+=K0[j];c++;}K[i]=s/c;}
  return {pts,source,X,Y,K,n,total:(n-1)*STEP,toXY,toLL};
}
function posAt(rt,s){const f=Math.max(0,Math.min(rt.n-1.000001,s/STEP)),i=Math.floor(f),u=f-i,j=Math.min(rt.n-1,i+1);return rt.toLL(rt.X[i]+(rt.X[j]-rt.X[i])*u,rt.Y[i]+(rt.Y[j]-rt.Y[i])*u);}
function radiusAt(rt,s){const i=Math.max(0,Math.min(rt.n-1,Math.round(s/STEP)));return 1/Math.max(Math.abs(rt.K[i]),1e-5);}
function nearestS(rt,lat,lon,from){const [x,y]=rt.toXY(lat,lon);let best=1e18,bs=0;for(let i=Math.max(0,Math.floor((from||0)/STEP)-2);i<rt.n-1;i++){const ax=rt.X[i],ay=rt.Y[i],dx=rt.X[i+1]-ax,dy=rt.Y[i+1]-ay,L2=dx*dx+dy*dy||1;let u=((x-ax)*dx+(y-ay)*dy)/L2;u=Math.max(0,Math.min(1,u));const ex=ax+dx*u-x,ey=ay+dy*u-y,d=ex*ex+ey*ey;if(d<best){best=d;bs=(i+u)*STEP;}}return bs;}

function computeNotes(rt){
  const K=rt.K,n=rt.n,thr=1/300,cal=+cfg.calib||1;
  const groups=[];let cur=null;
  for(let i=0;i<n;i++){
    const sg=K[i]>thr?1:K[i]<-thr?-1:0;if(!sg)continue;
    if(cur&&cur.sg===sg&&i-cur.e<=3)cur.e=i;else{if(cur)groups.push(cur);cur={sg,s:i,e:i};}
  }
  if(cur)groups.push(cur);
  const T=[175,110,70,45,25,13].map(v=>v*cal);
  const notes=[];
  for(const g of groups){
    let sum=0,mx=0,ap=g.s;
    for(let i=g.s;i<=g.e;i++){sum+=K[i];if(Math.abs(K[i])>mx){mx=Math.abs(K[i]);ap=i;}}
    // recorta los extremos suaves para que la curva empiece donde de verdad empieza
    while(g.s<ap&&Math.abs(K[g.s])<mx*0.35)g.s++;
    while(g.e>ap&&Math.abs(K[g.e])<mx*0.35)g.e--;
    // radio robusto: media de las 3 curvaturas más fuertes
    const top=[];for(let i=g.s;i<=g.e;i++)top.push(Math.abs(K[i]));top.sort((a,b)=>b-a);
    const kk=top.slice(0,3).reduce((a,b)=>a+b,0)/Math.min(3,top.length);
    const ang=Math.abs(sum)*STEP/D2R, R=1/kk;
    if(ang<15)continue;
    let gr=R>=T[0]?1:R>=T[1]?2:R>=T[2]?3:R>=T[3]?4:R>=T[4]?5:R>=T[5]?6:7;
    if(ang>=150&&R<25*cal)gr=7;
    if(gr===1&&ang<22)continue;
    const Lg=(g.e-g.s)*STEP,mods=[];
    if(Lg>=200)mods.push('vlong');else if(Lg>=100)mods.push('long');
    if(Lg>=40&&gr<7){
      const th=Math.max(1,Math.floor((g.e-g.s+1)/3));let a=0,b=0;
      for(let i=0;i<th;i++){a+=Math.abs(K[g.s+i]);b+=Math.abs(K[g.e-i]);}
      if(b>a*1.6)mods.push('tightens');else if(a>b*1.6)mods.push('opens');
    }
    notes.push({s:g.s*STEP,e:g.e*STEP,a:ap*STEP,dir:g.sg>0?'L':'R',g:gr,R:Math.round(R),ang:Math.round(ang),mods});
  }
  return linkNotes(notes,rt.total);
}
function roundDist(d){if(d<=500){const Ls=[30,50,70,100,150,200,250,300,350,400,500];return Ls.reduce((a,b)=>Math.abs(b-d)<Math.abs(a-d)?b:a);}return Math.round(d/100)*100;}
function linkNotes(notes,total){
  notes.forEach(n=>{n.mods=(n.mods||[]).map(m=>MOD_ES[m]||m).filter(m=>MODK.includes(m));});
  notes.sort((a,b)=>a.s-b.s);
  notes.forEach((nt,i)=>{const nx=notes[i+1];const gap=(nx?nx.s:total)-nt.e;nt.gap=Math.max(0,Math.round(gap));nt.gw=nx?(gap<20?'y':String(roundDist(gap))):'meta';});
  return notes;
}
/* textos de notas */
const gLabel=g=>g===7?'H':String(cfg.scale==='1fast'?g:7-g);
const gWord=g=>g===7?L_().sp.hp:L_().sp.nums[cfg.scale==='1fast'?g:7-g];
const modTxt=m=>L_().mods[m]||m;
function noteTitle(nt){return `${t(nt.dir==='L'?'dirL':'dirR')} ${nt.g===7?L_().sp.hp:gLabel(nt.g)}`;}
/* ---------- frases por palabras (tokens) ----------
   n1..n6 número · hp horquilla · L/R dirección · mods · and · dNNN distancia · fin meta · start salida */
const DISTS=[30,50,70,100,150,200,250,300,350,400,500,600,700,800,900,1000];
const spokenNum=g=>cfg.scale==='1fast'?g:7-g;
function noteTokens(nt){
  const m=nt.mods||[],out=[];
  if(m.includes('caution'))out.push('caution');
  const rally=cfg.vstyle!=='normal';
  const num=nt.g===7?'hp':'n'+spokenNum(nt.g);
  if(rally)out.push(num,nt.dir);else out.push(nt.dir,num);
  m.filter(x=>x!=='caution').forEach(x=>out.push(x));
  return out;
}
const distTok=d=>{const r=roundDist(d);return DISTS.includes(r)?'d'+r:'#'+r;};
const gapTokens=nt=>nt.gw==='y'?['and']:nt.gw==='meta'?['fin']:[distTok(+nt.gw)];
function tokWord(tok){
  const S=L_().sp;
  if(tok[0]==='#')return tok.slice(1);
  if(/^n\d$/.test(tok))return S.nums[+tok[1]];
  if(/^d\d+$/.test(tok))return tok.slice(1);
  return {hp:S.hp,L:S.L,R:S.R,and:S.and,fin:S.finish,start:S.start}[tok]??modTxt(tok);
}
const tokText=toks=>toks.map(x=>x===','?',':tokWord(x)).join(' ').replace(/ ,/g,',');
function noteSpeech(nt){return tokText(noteTokens(nt));}
const gapTxt=nt=>nt.gw==='y'?L_().sp.and.toUpperCase():nt.gw==='meta'?t('finishW'):nt.gw;
const gapSpeech=nt=>tokText(gapTokens(nt));
function arrowIcon(nt,cls){return ic(nt.g===7?(nt.dir==='L'?'HL':'HR'):nt.dir,cls||'i');}


/* ---------- voz: cola única (voz del móvil o copiloto grabado) ---------- */
const Voice={muted:false,voices:[],last:null,q:[],busy:false,
  load(){if(!('speechSynthesis'in window))return;try{this.all=speechSynthesis.getVoices();}catch(e){this.all=[];}this.filter();},
  filter(){const p=cfg.lang;this.voices=(this.all||[]).filter(v=>(v.lang||'').toLowerCase().startsWith(p));fillVoices();},
  pick(){const V=VLANG[cfg.lang];return this.voices.find(v=>v.voiceURI===cfg.voice)||this.voices.find(v=>(v.lang||'').replace('_','-')===V)||this.voices[0]||null;},
  say(txt,flush){if(txt)this.push({text:txt},flush);},
  sayTok(toks,flush){if(toks&&toks.length)this.push({toks},flush);},
  push(item,flush){this.last=item;if(this.muted)return;if(flush)this.cancel();this.q.push(item);this.next();},
  repeat(){if(this.last)this.push(this.last,true);},
  cancel(){this.q=[];clearTimeout(this.tm);try{speechSynthesis.cancel();}catch(e){}this.busy=false;},
  async next(){
    if(this.busy||!this.q.length)return;this.busy=true;const it=this.q.shift();
    const done=()=>{clearTimeout(this.tm);this.busy=false;this.next();};
    try{
      const txt=it.text||tokText(it.toks);
      if(!('speechSynthesis'in window)){done();return;}
      const u=new SpeechSynthesisUtterance(txt);u.lang=VLANG[cfg.lang];const v=this.pick();if(v)u.voice=v;
      const rally=cfg.vstyle!=='normal'&&!!it.toks;
      u.rate=(+cfg.rate||1.1)*(rally?1.18:1);u.pitch=rally?1.05:1;
      u.onend=u.onerror=done;this.tm=setTimeout(done,Math.max(2500,txt.length*140));
      speechSynthesis.speak(u);
    }catch(e){done();}
  },
  unlock(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
};

const TILE={
  dark:()=>[esri('Canvas/World_Dark_Gray_Base',{maxNativeZoom:16}),esri('Canvas/World_Dark_Gray_Reference',{maxNativeZoom:16,attribution:''})],
  streets:()=>[esri('World_Street_Map')],

function setBase(m){
  const st=realStyle();if(m._st===st)return;
  (m._tiles||[]).forEach(l=>m.removeLayer(l));
  m._tiles=TILE[st]();m._tiles.forEach((l,i)=>{l.addTo(m);if(i===0)l.bringToBack();});m._st=st;
  // si la capa base no carga, se cambia sola a una que funcione
  let errs=0;const base=m._tiles[0];
  base.on('tileerror',()=>{if(++errs===8&&m._st===st&&st!=='sat'){m._st=null;(m._tiles||[]).forEach(l=>m.removeLayer(l));m._tiles=TILE[st==='streets'?'sat':'streets']();m._tiles.forEach(l=>l.addTo(m));m._st=st;}});

function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error(t('noGps')));navigator.geolocation.getCurrentPosition(p=>res([p.coords.latitude,p.coords.longitude]),()=>rej(new Error(t('locFail'))),{enableHighAccuracy:true,timeout:10000,maximumAge:5000});});}
async function osrm(pts,steps){
  const q=pts.map(p=>`${p[1].toFixed(6)},${p[0].toFixed(6)}`).join(';');
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${q}?overview=full&geometries=geojson${steps?'&steps=true':''}`);
  const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw new Error(t('routeErr'));
  const rt=j.routes[0];
  const mans=[];if(steps)for(const lg of rt.legs)for(const s of lg.steps){const m=s.maneuver;mans.push({ll:[m.location[1],m.location[0]],type:m.type,mod:m.modifier||'',exit:m.exit||0,name:s.name||s.ref||''});}
  return {pts:rt.geometry.coordinates.map(c=>[c[1],c[0]]),dist:rt.distance,dur:rt.duration,mans};
}

const Nav={dest:null,res:null,layers:[],seq:0,busy:false,
  init(){
    const m=makeMap('mapNav');if(!m)return;
    if(!this.bound){this.bound=1;m.on('click',e=>this.setDest([e.latlng.lat,e.latlng.lng]));}
    this.clear();
    getPos().then(p=>{this.here=p;m.setView(p,14);this.drawMe();}).catch(()=>{});
  },
  clear(){this.dest=null;this.res=null;this.layers.forEach(l=>l.remove());this.layers=[];$('#nvResults').classList.add('hidden');this.info();},
  drawMe(){if(this.meMk)this.meMk.remove();if(this.here&&maps.mapNav)this.meMk=L.marker(this.here,{icon:meIcon()}).addTo(maps.mapNav);},
  async setDest(p,label){
    this.dest=p;this.label=label||'';this.layers.forEach(l=>l.remove());this.layers=[L.marker(p,{icon:flagIcon()}).addTo(maps.mapNav)];
    this.busy=true;this.info();const seq=++this.seq;
    try{
      if(!this.here)this.here=await getPos();this.drawMe();
      const r=await osrm([this.here,p],true);if(seq!==this.seq)return;
      this.res=r;this.layers.push(L.polyline(r.pts,{color:'#ff5a00',weight:6,opacity:.9}).addTo(maps.mapNav));
      maps.mapNav.fitBounds(this.layers[1].getBounds(),{padding:[30,30]});
    }catch(e){if(seq===this.seq){this.res=null;toast(e.message,'bad');}}
    if(seq===this.seq){this.busy=false;this.info();}
  },
  info(){
    $('#nvInfo').textContent=this.busy?t('calc'):this.res?t('navInfo',{d:fmtKm(this.res.dist),t:fmtMin(this.res.dur)}):t('navInfo0');
    ['#nvGo','#nvSim','#nvSave'].forEach(s=>$(s).disabled=!this.res||this.busy);
  },
  data(){const rt=buildRoute(this.res.pts,'nav');const notes=computeNotes(rt);return {rt,pts:rt.pts,notes,mans:prepMans(rt,this.res.mans,notes),dest:this.dest,name:this.label};},
  async reroute(lat,lon){
    if(this.rerouting)return;this.rerouting=true;Voice.say(L_().sp.reroute,true);$('#drGps').textContent=t('rerouting');
    try{const r=await osrm([[lat,lon],Drive.d.dest],true);this.res=r;const d=this.data();Drive.load(d,true);}
    catch(e){toast(e.message,'bad');}
    this.rerouting=false;
  }
};
function prepMans(rt,mans,notes){
  const out=[];let lastS=0;
  for(const m of mans){
    if(m.type==='depart')continue;
    if((m.type==='new name'||m.type==='continue'||m.type==='notification')&&(!m.mod||m.mod==='straight'))continue;
    const s=m.type==='arrive'?rt.total:nearestS(rt,m.ll[0],m.ll[1],lastS);lastS=s;
    out.push({...m,s,far:false,near:false});
  }
  // las notas que coinciden con un cruce/rotonda las sustituye la indicación
  for(const m of out){if(m.type==='arrive')continue;notes.forEach(n=>{if(n.e>=m.s-25&&n.s<=m.s+25)n.nav=true;});}
  return out.sort((a,b)=>a.s-b.s);
}
function manText(m){
  const M=L_().man;
  if(m.type==='arrive')return M.arrive;
  let base;
  if(m.type==='roundabout'||m.type==='rotary'||m.type==='roundabout turn')base=fmt(M.round,{n:m.exit||1});
  else base=M[m.mod]||M.straight;
  return base+(m.name&&m.type!=='roundabout'&&m.type!=='rotary'?fmt(M.onto,{s:m.name}):'');
}
function manIcon(m){
  if(m.type==='arrive')return 'FIN';

}

const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function overpass(q){
  let last;
  for(const u of OVERPASS){
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch(u+'?data='+encodeURIComponent(q),{signal:ctl.signal});clearTimeout(to);
      if(!r.ok){last=new Error('HTTP '+r.status);continue;}
      const j=await r.json();if(j&&j.elements)return j;
    }catch(e){last=e;}
  }
  throw new Error('net:'+(last&&last.message||''));
}
async function circuitTrack(x){
  const R=Math.round(x.m*1.5);
  const q=`[out:json][timeout:25];(way["highway"="raceway"](around:${R},${x.c[0]},${x.c[1]});way["leisure"="track"]["sport"~"motor"](around:${R},${x.c[0]},${x.c[1]}););out geom;`;
  const j=await overpass(q);
  const bad=/pit|box|paddock|kart|drift|skid|offroad|motocross|supermoto|slalom|fahrsicherheit|driving school|escuela/i;
  const ways=(j.elements||[]).filter(e=>e.type==='way'&&e.geometry&&e.geometry.length>1&&!bad.test([(e.tags||{}).name,(e.tags||{}).raceway,(e.tags||{}).description,(e.tags||{}).service,(e.tags||{}).alt_name].join(' ')))
    .map(e=>({id:e.id,g:e.geometry.map(p=>[p.lat,p.lon])}));
  if(!ways.length)throw new Error('empty');
  // grafo de puntos: así se unen tramos aunque se crucen por el medio
  const K=p=>p[0].toFixed(6)+','+p[1].toFixed(6),N={};
  const node=p=>N[K(p)]||(N[K(p)]={p,adj:[]});
  for(const w of ways){w.len=0;for(let i=1;i<w.g.length;i++){const a=node(w.g[i-1]),b=node(w.g[i]);a.adj.push({to:b,w:w.id});b.adj.push({to:a,w:w.id});w.len+=hav(w.g[i-1],w.g[i]);}}
  // empieza por el tramo largo más cercano al centro del circuito
  const score=w=>w.len-Math.min(...w.g.map(p=>hav(p,x.c)))*0.5;
  ways.sort((a,b)=>score(b)-score(a));
  const brg=(a,b)=>Math.atan2((b[1]-a[1])*Math.cos(a[0]*D2R),b[0]-a[0]);
  const turn=(a,b)=>Math.abs(((b-a+3*Math.PI)%(2*Math.PI))-Math.PI);
  for(const w0 of ways.slice(0,4)){
    const start=node(w0.g[0]);let prev=start,cur=node(w0.g[1]),curW=w0.id;
    const path=[start.p,cur.p],usedE=new Set([K(start.p)+'>'+K(cur.p)]);let len=hav(start.p,cur.p),ok=false;
    for(let k=0;k<30000;k++){
      if(cur===start&&len>800){ok=true;break;}
      if(len>800&&hav(cur.p,start.p)<12){path.push(start.p);ok=true;break;}
      const dir=brg(prev.p,cur.p);let best=null,bs=1e9;
      for(const e of cur.adj){
        if(e.to===prev)continue;const ek=K(cur.p)+'>'+K(e.to.p);if(usedE.has(ek))continue;
        const sc=turn(dir,brg(cur.p,e.to.p))+(e.w===curW?0:0.25);
        if(sc<bs){bs=sc;best=e;}
      }
      if(!best||bs>2.4)break;
      usedE.add(K(cur.p)+'>'+K(best.to.p));len+=hav(cur.p,best.to.p);path.push(best.to.p);prev=cur;cur=best.to;curW=best.w;
    }
    if(ok&&len>1000)return path;
  }
  throw new Error('loop');
}

const Ed={wps:[],markers:[],line:null,geom:null,busy:false,seq:0,
  init(){
    const m=makeMap('mapEd');if(!m)return;
    if(!this.bound){this.bound=1;m.on('click',e=>this.add([e.latlng.lat,e.latlng.lng]));}
    this.clear();getPos().then(p=>m.setView(p,13)).catch(()=>{});
  },
  add(p){this.wps.push(p);this.draw();this.route();},
  undo(){this.wps.pop();this.draw();this.route();},
  clear(){this.wps=[];this.geom=null;this.draw();},
  draw(){
    const m=maps.mapEd;if(!m)return;
    this.markers.forEach(x=>x.remove());this.markers=[];
    this.wps.forEach((p,i)=>{const fin=i===this.wps.length-1&&i>0;
      const mk=L.marker(p,{draggable:true,icon:fin?flagIcon():L.divIcon({className:'',html:`<div class="wp-ic">${i===0?'S':i}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(m);
      mk.on('dragend',()=>{const ll=mk.getLatLng();this.wps[i]=[ll.lat,ll.lng];this.route();});this.markers.push(mk);});
    if(this.line&&this.wps.length<2){this.line.remove();this.line=null;}
    this.info();
  },
  info(){
    const n=this.wps.length;
    $('#edInfo').textContent=this.busy?t('calc'):n===0?t('edInfo0'):n===1?t('edInfo1'):this.geom?t('edRoute',{d:fmtKm(this.geom.dist),n}):t('noRoute');
    $('#edGen').disabled=!this.geom||this.busy;
  },
  async route(){
    if(this.wps.length<2){this.geom=null;this.info();return;}
    this.busy=true;this.info();const seq=++this.seq;
    try{const r=await osrm(this.wps,false);if(seq!==this.seq)return;this.geom=r;
      if(this.line)this.line.remove();this.line=L.polyline(r.pts,{color:'#ff5a00',weight:5,opacity:.9}).addTo(maps.mapEd);}
    catch(e){if(seq===this.seq){this.geom=null;toast(e.message,'bad');}}
    if(seq===this.seq){this.busy=false;this.info();}
  }
};

const Rec={pts:[],watch:null,state:'idle',t0:0,elapsed:0,times:[],line:null,me:null,timer:null,
  init(){const m=makeMap('mapRec');this.reset();if(m)getPos().then(p=>m.setView(p,16)).catch(()=>{});this.startWatch();},
  reset(){this.pts=[];this.state='idle';this.elapsed=0;this.times=[];if(this.line){this.line.remove();this.line=null;}this.ui();},
  startWatch(){
    if(!navigator.geolocation){$('#rcGps').textContent=t('noGps');return;}
    if(this.watch!==null)return;
    this.watch=navigator.geolocation.watchPosition(p=>this.fix(p),e=>{$('#rcGps').textContent=t('err');$('#rcState').textContent='GPS: '+e.message;},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  },
  fix(p){
    const now=Date.now();this.times.push(now);this.times=this.times.filter(x=>now-x<5000);
    const acc=p.coords.accuracy,ll=[p.coords.latitude,p.coords.longitude];
    $('#rcGps').textContent=t(acc<=15?'good':acc<=30?'fair':'bad');$('#rcGps').style.color=acc<=15?'var(--ok)':acc<=30?'var(--warn)':'var(--bad)';
    $('#rcAcc').textContent=Math.round(acc)+' m';$('#rcHz').textContent=(this.times.length/5).toFixed(1)+' Hz';
    const m=maps.mapRec;
    if(m){if(!this.me)this.me=L.marker(ll,{icon:meIcon()}).addTo(m);else this.me.setLatLng(ll);}
    if(this.state!=='rec'||acc>30)return;
    const last=this.pts[this.pts.length-1];if(last&&hav(last,ll)<3)return;
    this.pts.push(ll);
    if(m){if(!this.line)this.line=L.polyline(this.pts,{color:'#ff5a00',weight:5}).addTo(m);else this.line.setLatLngs(this.pts);m.panTo(ll,{animate:false});}
    this.ui();
  },
  dist(){let d=0;for(let i=1;i<this.pts.length;i++)d+=hav(this.pts[i-1],this.pts[i]);return d;},
  ui(){
    $('#rcPts').textContent=this.pts.length;$('#rcDist').textContent=fmtKm(this.dist());
    const el=this.elapsed+(this.state==='rec'?Date.now()-this.t0:0),s=Math.floor(el/1000);$('#rcTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    $('#rcStart').classList.toggle('hidden',this.state==='rec');
    $('#rcStartT').textContent=this.state==='paused'?t('resume'):t('startB');
    $('#rcPause').classList.toggle('hidden',this.state!=='rec');
    $('#rcStop').classList.toggle('hidden',this.state==='idle');
    $('#rcState').textContent=this.state==='rec'?t('recOn'):this.state==='paused'?t('paused'):t('recReady');
  },
  start(){this.startWatch();this.state='rec';this.t0=Date.now();clearInterval(this.timer);this.timer=setInterval(()=>this.ui(),1000);this.ui();},
  pause(){this.elapsed+=Date.now()-this.t0;this.state='paused';clearInterval(this.timer);this.ui();},
  stop(silent){
    if(this.state==='rec')this.elapsed+=Date.now()-this.t0;
    clearInterval(this.timer);if(this.watch!==null){navigator.geolocation.clearWatch(this.watch);this.watch=null;}
    if(this.me){this.me.remove();this.me=null;}
    const pts=this.pts.slice(),dist=this.dist();this.state='idle';
    if(silent)return;
    if(pts.length<10||dist<100)return toast(t('tooShort'),'bad');
    newStage(t('recName')+' '+new Date().toLocaleDateString(VLANG[cfg.lang]),'rec',pts);
  }
};

}

/* =========================================================
   MODO COPILOTO / NAVEGADOR (GPS o simulación)
   modos: gps · sim · nav · navsim
   ========================================================= */
const Drive={
  open(mode,data){
    if(!data.notes.length&&!data.mans.length)return toast(t('noNotes'),'bad');
    this.on=true;this.mode=mode;this.nav=mode==='nav'||mode==='navsim';this.sim=mode==='sim'||mode==='navsim';
    this.running=false;this.done=false;this.fixTimes=[];
    $('#scr-drive').classList.add('act');
    $('#drMode').textContent=this.sim?t('simMode'):this.nav?t('navMode'):'GPS';$('#drMode').className='pill '+(this.sim?'warn':'ok');
    $('#drSimBar').classList.toggle('hidden',!this.sim);
    $('#drGps').className='pill'+(this.sim?' hidden':'');$('#drGps').textContent=t('seekGps');
    $('#drLeftL').textContent=t(this.nav?'toDest':'toFinish');
    this.zoom=this.zoom||17;this.headBtn();
    this.load(data,false);
    if(!this.sim)this.startGps();
    this.setGo('play');
  },
  load(data,keep){
    this.d=data;this.rt=data.rt;this.notes=data.notes.filter(n=>!n.nav);this.mans=data.mans||[];
    this.s=0;this.idx=0;this.nextAnn=0;this.off=false;this.offN=0;this.lastFix=null;if(!keep)this.v=0;
    $('#drOff').classList.add('hidden');
    const m=makeMap('mapDr');
    if(m){
      (this.layers||[]).forEach(l=>l.remove());
      this.layers=[L.polyline(data.pts,{color:'#ff5a00',weight:6}).addTo(m),L.marker(data.pts[data.pts.length-1],{icon:flagIcon()}).addTo(m)];
      this.me=L.marker(data.pts[0],{icon:L.divIcon({className:'',html:'<div class="me-nav"><svg viewBox="0 0 24 24"><path d="M12 2 20 21 12 16.5 4 21z" fill="#3b82f6" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(m);this.layers.push(this.me);
      this.rot=null;this.hd=null;
      setTimeout(()=>{this.sizeRot();this.follow(data.pts[0][0],data.pts[0][1]);},90);
    }
    this.update();
  },
  setGo(i){$('#drGo').innerHTML=ic(i);$('#drGo').setAttribute('aria-label',t(i==='pause'?'pauseB':i==='repeat'?'repeat':'go'));},
  startGps(){
    if(!navigator.geolocation){$('#drGps').textContent=t('noGps');return;}
    this.watch=navigator.geolocation.watchPosition(p=>this.onFix(p.coords.latitude,p.coords.longitude,p.coords.speed,p.coords.accuracy),e=>{$('#drGps').textContent='GPS: '+e.message;$('#drGps').className='pill bad';},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  },
  async go(){
    Voice.unlock();
    if(this.done){this.load(this.d,false);this.done=false;}
    if(this.running){this.running=false;this.setGo('play');clearInterval(this.simT);Voice.cancel();return;}
    this.running=true;this.setGo('pause');
    Awake.enable();
    if(this.s<5&&this.nextAnn===0){
      if(this.nav)Voice.say(L_().sp.navStart,true);
      else{const n0=this.notes[0];Voice.sayTok(['start',',',distTok(Math.max(30,n0.s-this.s))],true);}
    }
    if(this.sim){this.lastT=performance.now();clearInterval(this.simT);this.simT=setInterval(()=>this.simTick(),100);}
  },
  simTick(){
    const now=performance.now(),dt=Math.min(.3,(now-this.lastT)/1000);this.lastT=now;
    const want=(+$('#drSimSpd').value)/3.6;
    let rmin=1e9;const look=Math.max(40,this.v*3);for(let d=0;d<=look;d+=STEP)rmin=Math.min(rmin,radiusAt(this.rt,this.s+d));
    let tgt=Math.min(want,Math.sqrt(7*rmin));
    if(this.nav){const m=this.mans.find(x=>x.s>this.s-5&&x.type!=='arrive');if(m&&m.s-this.s<80&&manIcon(m)!=='ST'&&manIcon(m)!=='SR'&&manIcon(m)!=='SL')tgt=Math.min(tgt,6+(m.s-this.s)*0.12);}
    this.v+=Math.max(-7*dt,Math.min(3.5*dt,tgt-this.v));this.v=Math.max(3,this.v);
    const s=Math.min(this.rt.total,this.s+this.v*dt);const p=posAt(this.rt,s);
    this.onFix(p[0],p[1],this.v,5,s);
  },
  match(x,y){
    const rt=this.rt;let best=1e12,bi=0,bt=0;
    const scan=(a,b)=>{for(let i=a;i<b;i++){const ax=rt.X[i],ay=rt.Y[i],dx=rt.X[i+1]-ax,dy=rt.Y[i+1]-ay;const L2=dx*dx+dy*dy||1;let u=((x-ax)*dx+(y-ay)*dy)/L2;u=Math.max(0,Math.min(1,u));const ex=ax+dx*u-x,ey=ay+dy*u-y,d=ex*ex+ey*ey;if(d<best){best=d;bi=i;bt=u;}}};
    scan(Math.max(0,this.idx-20),Math.min(rt.n-1,this.idx+200));
    if(best>80*80)scan(0,rt.n-1);
    return {s:(bi+bt)*STEP,d:Math.sqrt(best),i:bi};
  },
  onFix(lat,lon,spd,acc,simS){
    const now=Date.now();this.fixTimes.push(now);this.fixTimes=this.fixTimes.filter(x=>now-x<5000);
    if(!this.sim&&!Nav.rerouting){$('#drGps').textContent=`GPS ±${Math.round(acc)} m · ${(this.fixTimes.length/5).toFixed(1)} Hz`;$('#drGps').className='pill '+(acc<=15?'ok':acc<=30?'warn':'bad');}
    this.gps=[lat,lon];
    if(!this.running){this.follow(lat,lon,true);return;}
    let s,d=0;
    if(simS!=null)s=simS;
    else{
      if(acc>40)return; // posición poco fiable: se ignora
      const [x,y]=this.rt.toXY(lat,lon);const m=this.match(x,y);s=m.s;d=m.d;
      const v=spd!=null&&spd>=0?spd:(this.lastFix?Math.abs(s-this.lastFix.s)/Math.max(.2,(now-this.lastFix.t)/1000):0);
      this.v=this.v*0.4+v*0.6;
      // compensa el retraso del GPS (≈0,7 s)
      s+=this.v*0.7;
      this.lastFix={s,t:now};
      if(!this.tick)this.tick=setInterval(()=>this.interp(),200);}
    const off=d>50;
    this.offN=off?this.offN+1:0;
    if(off!==this.off){this.off=off;$('#drOff').classList.toggle('hidden',!off);if(off&&!this.nav)Voice.say(L_().sp.off,true);}
    if(off&&this.nav&&this.offN>=3&&(!this.lastRR||now-this.lastRR>10000)){this.lastRR=now;Nav.reroute(lat,lon);return;}
    if(!off&&(simS!=null||s>=this.s-30))this.s=s;
    this.idx=Math.floor(this.s/STEP);
    this.follow(lat,lon);this.announce();this.update();
    if(this.s>=this.rt.total-(this.nav?20:10)&&!this.done){this.done=true;this.running=false;clearInterval(this.simT);Voice.say(this.nav?L_().sp.arrived:L_().sp.done,false);this.setGo('repeat');}
  },
  sizeRot(){const r=$('#drRot');if(!r)return;const d=Math.ceil(Math.hypot(r.clientWidth,r.clientHeight))+6;$('#mapDr').style.setProperty('--d',d+'px');if(maps.mapDr)maps.mapDr.invalidateSize({pan:false});},
  headBtn(){const up=cfg.headUp!==false,b=$('#drHead');b.innerHTML=`<span style="display:grid;transform:rotate(${up?(this.rot||0):0}deg);transition:transform .45s linear">${ic('compass')}</span>`;b.classList.toggle('on',up);b.title=t(up?'headUp':'northUp');if(this.d)this.follow();},
  follow(lat,lon,raw){
    const m=maps.mapDr,rt=this.rt;if(!m||!rt)return;
    const ll=(lat!=null&&(raw||this.off))?[lat,lon]:posAt(rt,this.s);
    // rumbo de la carretera por delante (más estable que el del GPS)
    let hd=this.hd;
    if(!this.off){const a=posAt(rt,Math.max(0,this.s-5)),b=posAt(rt,Math.min(rt.total,this.s+35));const [ax,ay]=rt.toXY(a[0],a[1]),[bx,by]=rt.toXY(b[0],b[1]);if(Math.hypot(bx-ax,by-ay)>3)hd=Math.atan2(bx-ax,by-ay)*180/Math.PI;}
    if(hd==null)hd=0;
    const up=cfg.headUp!==false;
    let rot=up?-hd:0;if(this.rot!=null){while(rot-this.rot>180)rot-=360;while(rot-this.rot<-180)rot+=360;}
    this.rot=rot;this.hd=hd;
    $('#mapDr').style.setProperty('--rot',rot+'deg');
    if(this.me){this.me.setLatLng(ll);const el=this.me.getElement();if(el&&el.firstChild)el.firstChild.style.transform=`rotate(${hd+rot}deg)`;}
    const hb=$('#drHead span');if(hb)hb.style.transform=`rotate(${up?rot:0}deg)`;
    // la posición queda en la parte baja para ver más carretera por delante
    const z=this.zoom||17,mpp=156543.03*Math.cos(ll[0]*D2R)/2**z,off=($('#drRot').clientHeight||300)*0.25*mpp,h=(up?hd:0)*D2R;
    const [x,y]=rt.toXY(ll[0],ll[1]);
    m.setView(rt.toLL(x+Math.sin(h)*off,y+Math.cos(h)*off),z,{animate:false});
  },
  interp(){
    // entre posiciones GPS avanza la posición estimada para que avisos y distancias vayan finos
    if(!this.running||this.sim||!this.lastFix||this.off)return;
    const dt=(Date.now()-this.lastFix.t)/1000;if(dt>3)return;
    const sp=this.lastFix.s+this.v*dt;
    if(sp>this.s&&sp-this.lastFix.s<60){this.s=Math.min(sp,this.rt.total);this.idx=Math.floor(this.s/STEP);this.follow();this.announce();this.update();}
  },
  announce(){
    const v=this.v,S=L_().sp;
    // indicaciones del navegador
    if(this.nav)for(const m of this.mans){
      if(m.type==='arrive')continue;
      const d=m.s-this.s;if(d<-10){m.far=m.near=true;continue;}
      const nearD=Math.max(35,v*4),farD=Math.max(250,v*12);
      if(!m.near&&d<=nearD){m.near=m.far=true;Voice.say(manText(m),false);}
      else if(!m.far&&d<=farD&&d>nearD+40){m.far=true;Voice.say(fmt(S.inD,{d:roundDist(d),m:manText(m)}),false);}
    }
    // notas de curva (en navegador se callan por debajo de 25 km/h)
    const lead=Math.max(50,v*((+cfg.lead||5)+0.8)),N=this.notes;
    while(this.nextAnn<N.length){
      const n=N[this.nextAnn];
      if(n.e<this.s){this.nextAnn++;continue;}
      if(n.s-this.s>lead)break;
      let j=this.nextAnn;const toks=[...noteTokens(N[j])];
      while(N[j].gw==='y'&&j+1<N.length){j++;toks.push(',','and',...noteTokens(N[j]));}
      const last=N[j];
      if(last.gw==='meta'){if(!this.nav&&last.gap<=500)toks.push(',',distTok(Math.max(30,last.gap)),',','fin');}
      else toks.push(',',distTok(+last.gw));
      if(!(this.nav&&v<7))Voice.sayTok(toks,false);
      this.nextAnn=j+1;
    }
  },
  /* qué mostrar arriba (orden actual) y abajo (orden siguiente) */
  plan(){
    const N=this.notes,s=this.s,v=this.v||0;
    const k=N.findIndex(n=>n.e>=s);
    const m=this.nav?this.mans.find(x=>x.s>=s-10):null;
    const items=[];
    if(k>=0){items.push({kind:'note',n:N[k],at:N[k].s});if(N[k+1])items.push({kind:'note',n:N[k+1],at:N[k+1].s});}
    if(m){const mi=this.mans.indexOf(m);items.push({kind:'man',m,at:m.s});if(this.mans[mi+1])items.push({kind:'man',m:this.mans[mi+1],at:this.mans[mi+1].s});}
    items.sort((a,b)=>a.at-b.at);
    // un giro cercano tiene prioridad sobre una curva que está muy por delante
    let top=items[0]||null;
    if(top&&top.kind==='note'&&m&&m.s-s<=Math.max(300,v*15)&&m.s<=top.n.s+30)top={kind:'man',m,at:m.s};
    const same=(a,b)=>a&&b&&a.kind===b.kind&&(a.kind==='note'?a.n===b.n:a.m===b.m);
    const next=items.find(x=>!same(x,top))||null;
    return {top,next,k};
  },
  update(){
    const N=this.notes,{top,next,k}=this.plan(),box=$('#drTop');
    if(!top){
      box.className='topcard idle';box.innerHTML=`<div class="gr">${this.done||this.s>0?t('finishW'):t('ready')}</div>`;
    }else if(top.kind==='note'){
      const n=top.n,d=n.s-this.s;
      box.className='topcard c'+n.g;
      const md=[n.mods.includes('caution')?'¡'+modTxt('caution')+'!':'',t(n.dir==='L'?'dirL':'dirR'),...n.mods.filter(x=>x!=='caution').map(modTxt)].filter(Boolean).join(' · ');

async function initAuth(){
  if(!useFb){
    me=Object.assign({uid:'local',name:'',role:'user',phone:'',vehicles:[],photo:''},JSON.parse(localStorage.getItem('wt_profile')||'{}'));
    $('#localBar').classList.remove('hidden');$$('.fbonly').forEach(b=>b.classList.add('hidden'));
    show('scr-landing');return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  show('scr-landing');
  firebase.auth().onAuthStateChanged(async u=>{
    const first=!authReady;authReady=true;
    if(!u){me=null;if(!first)show('scr-landing');return;}
    try{
      const ref=db.collection('users').doc(u.uid);let snap=await ref.get();
      if(!snap.exists){const adm=ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((u.email||'').toLowerCase());await ref.set({name:showEmail(u.email).split('@')[0],email:u.email,role:adm?'admin':'user',active:true,phone:'',vehicles:[],photo:'',createdAt:Date.now()});snap=await ref.get();}
      const d=snap.data();
      if(d.active===false){await firebase.auth().signOut();show('scr-login');$('#lgErr').textContent=t('userOff');return;}
      if(d.email!==u.email){try{await ref.update({email:u.email});d.email=u.email;}catch(e){}}
      me={uid:u.uid,...d,email:u.email};
      if(curScr==='scr-login'||!first)show(homeScr());
    }catch(e){$('#lgErr').textContent=e.message;}
  });
}
