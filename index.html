<style>
:root{
  --bg:#0a0b0d;--bg2:#0f1114;--panel:#14171b;--panel2:#1b1f25;--line:#262b33;
  --txt:#f2f4f7;--mut:#8b95a2;--acc:#ff5a00;--acc2:#ff7a2e;--ok:#22c55e;--warn:#f5b301;--bad:#ef4444;
  --g1:#22c55e;--g2:#84cc16;--g3:#eab308;--g4:#f59e0b;--g5:#f97316;--g6:#ef4444;--g7:#d946ef;
  --r:8px;--sh:0 10px 30px rgba(0,0,0,.4);
  --disp:'Barlow Condensed','Arial Narrow',Inter,sans-serif;
  --carbon:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px);
  --checker:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/10px 10px;
}
[data-theme=light]{
  --bg:#eef1f4;--bg2:#e4e8ed;--panel:#ffffff;--panel2:#f3f5f8;--line:#d9dfe6;
  --txt:#111419;--mut:#5d6874;--sh:0 8px 24px rgba(20,30,40,.10);
  --carbon:repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 2px,transparent 2px 7px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
body{background-image:var(--carbon)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.checker{height:10px;background:var(--checker)}

/* top bar */
#top{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
#top .stripe{height:4px;background:linear-gradient(90deg,var(--acc) 0 70%,#fff 70% 74%,var(--acc) 74% 78%,transparent 78%)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{width:34px;height:34px;border-radius:8px}
.brand .wm{font-family:var(--disp);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.02em;line-height:1}
.brand .wm b{color:var(--acc)}
.brand small{display:block;font-family:Inter;font-style:normal;font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:2px}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--txt)}
.ib:hover{border-color:var(--acc)}
.ib.on{background:var(--acc);border-color:var(--acc);color:#fff}
.langsel{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 8px;font-weight:700;cursor:pointer}

main{max-width:1100px;margin:0 auto;padding:16px 14px 70px}
.scr{display:none}.scr.act{display:block}

/* ui */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
h1{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;font-size:32px;line-height:1;margin:0 0 6px;letter-spacing:.01em}
h2{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-style:italic;font-size:18px;margin:24px 0 10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
h2::before{content:"";width:18px;height:8px;background:var(--acc);transform:skewX(-20deg)}
.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-family:var(--disp);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.btn.pri:hover{background:var(--acc2)}
.btn.bad{color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.07em}
.in{width:100%;height:44px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);padding:0 12px;outline:none}
.in:focus{border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--mut)}
.chk input{width:18px;height:18px;accent-color:var(--acc)}

function paintIcons(root=document){root.querySelectorAll('[data-i]').forEach(el=>{if(el.dataset.done)return;el.dataset.done=1;el.insertAdjacentHTML('afterbegin',ic(el.dataset.i));});}

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ty=''){const d=document.createElement('div');d.className=ty;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200);}
const RE=6371000, D2R=Math.PI/180;
function hav(a,b){const dl=(b[0]-a[0])*D2R,dn=(b[1]-a[1])*D2R;const x=Math.sin(dl/2)**2+Math.cos(a[0]*D2R)*Math.cos(b[0]*D2R)*Math.sin(dn/2)**2;return 2*RE*Math.asin(Math.sqrt(x));}
const fmtKm=m=>m>=1000?(m/1000).toFixed(m>=10000?1:2).replace('.',cfg.lang==='en'?'.':',')+' km':Math.round(m)+' m';
const fmtMin=s=>s>=3600?`${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`:`${Math.max(1,Math.round(s/60))} min`;
const fmtDate=ts=>ts?new Date(ts).toLocaleDateString(VLANG[cfg.lang],{day:'2-digit',month:'short',year:'numeric'}):'';
function encNum(v){v=v<0?~(v<<1):(v<<1);let s='';while(v>=0x20){s+=String.fromCharCode((0x20|(v&0x1f))+63);v>>=5;}return s+String.fromCharCode(v+63);}
function encodePoly(pts){let o='',pa=0,po=0;for(const [a,b] of pts){const A=Math.round(a*1e5),B=Math.round(b*1e5);o+=encNum(A-pa)+encNum(B-po);pa=A;po=B;}return o;}
function decodePoly(s){const pts=[];let i=0,a=0,b=0;while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,c;do{c=s.charCodeAt(i++)-63;r|=(c&0x1f)<<sh;sh+=5;}while(c>=0x20);const d=(r&1)?~(r>>1):(r>>1);if(k===0)a+=d;else b+=d;}pts.push([a/1e5,b/1e5]);}return pts;}

/* =========================================================
   MOTOR DE NOTAS
   Escala interna: 1 = más rápida … 6 = más lenta, 7 = horquilla
   ========================================================= */
const STEP=5;
function buildRoute(rawPts,source){
  const pts=[rawPts[0]];
  for(const p of rawPts) if(hav(pts[pts.length-1],p)>0.8) pts.push(p);
  if(pts.length<2) throw new Error(t('shortRoute'));
  const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length, lon0=pts.reduce((a,p)=>a+p[1],0)/pts.length, c0=Math.cos(lat0*D2R);
  const toXY=(la,lo)=>[(lo-lon0)*D2R*RE*c0,(la-lat0)*D2R*RE];
  const toLL=(x,y)=>[lat0+y/(RE*D2R),lon0+x/(RE*D2R*c0)];
  const P=pts.map(p=>toXY(p[0],p[1]));
  const X=[P[0][0]],Y=[P[0][1]];let carry=0;
  for(let i=1;i<P.length;i++){
    const [ax,ay]=P[i-1],[bx,by]=P[i];const Ls=Math.hypot(bx-ax,by-ay);if(Ls<1e-6)continue;
    let u=STEP-carry;while(u<=Ls){X.push(ax+(bx-ax)*u/Ls);Y.push(ay+(by-ay)*u/Ls);u+=STEP;}
    carry=Ls-(u-STEP);
  }
  const last=P[P.length-1];if(carry>STEP*0.4){X.push(last[0]);Y.push(last[1]);}
  const n=X.length;
  const w=(source==='map'||source==='nav')?1:2;
  let Xs=X.slice(),Ys=Y.slice();
  for(let pass=0;pass<2;pass++){
    const nx=[],ny=[];
    for(let i=0;i<n;i++){let sx=0,sy=0,c=0;for(let j=Math.max(0,i-w);j<=Math.min(n-1,i+w);j++){sx+=Xs[j];sy+=Ys[j];c++;}nx.push(sx/c);ny.push(sy/c);}
    nx[0]=X[0];ny[0]=Y[0];nx[n-1]=X[n-1];ny[n-1]=Y[n-1];Xs=nx;Ys=ny;
  }
  const H=[];for(let i=0;i<n-1;i++)H.push(Math.atan2(Ys[i+1]-Ys[i],Xs[i+1]-Xs[i]));
  for(let i=1;i<H.length;i++){while(H[i]-H[i-1]>Math.PI)H[i]-=2*Math.PI;while(H[i]-H[i-1]<-Math.PI)H[i]+=2*Math.PI;}
  const W=2,K=new Array(n).fill(0);
  for(let i=0;i<n;i++){const a=Math.max(0,i-W),b=Math.min(H.length-1,i+W-1);if(b>a)K[i]=(H[b]-H[a])/((b-a)*STEP);}
  return {pts,source,X,Y,K,n,total:(n-1)*STEP,toXY,toLL};
}
function posAt(rt,s){const f=Math.max(0,Math.min(rt.n-1.000001,s/STEP)),i=Math.floor(f),u=f-i,j=Math.min(rt.n-1,i+1);return rt.toLL(rt.X[i]+(rt.X[j]-rt.X[i])*u,rt.Y[i]+(rt.Y[j]-rt.Y[i])*u);}
function radiusAt(rt,s){const i=Math.max(0,Math.min(rt.n-1,Math.round(s/STEP)));return 1/Math.max(Math.abs(rt.K[i]),1e-5);}
function nearestS(rt,lat,lon){const [x,y]=rt.toXY(lat,lon);let best=1e18,bs=0;for(let i=0;i<rt.n-1;i++){const ax=rt.X[i],ay=rt.Y[i],dx=rt.X[i+1]-ax,dy=rt.Y[i+1]-ay,L2=dx*dx+dy*dy||1;let u=((x-ax)*dx+(y-ay)*dy)/L2;u=Math.max(0,Math.min(1,u));const ex=ax+dx*u-x,ey=ay+dy*u-y,d=ex*ex+ey*ey;if(d<best){best=d;bs=(i+u)*STEP;}}return bs;}

function computeNotes(rt){
  const K=rt.K,n=rt.n,thr=1/350,cal=+cfg.calib||1;
  const groups=[];let cur=null;
  for(let i=0;i<n;i++){
    const sg=K[i]>thr?1:K[i]<-thr?-1:0;if(!sg)continue;
    if(cur&&cur.sg===sg&&i-cur.e<=3)cur.e=i;else{if(cur)groups.push(cur);cur={sg,s:i,e:i};}
  }
  if(cur)groups.push(cur);
  const T=[175,110,70,45,25,13].map(v=>v*cal);
  const notes=[];
  for(const g of groups){
    let sum=0,mx=0,ap=g.s;
    for(let i=g.s;i<=g.e;i++){sum+=K[i];if(Math.abs(K[i])>mx){mx=Math.abs(K[i]);ap=i;}}
    const ang=Math.abs(sum)*STEP/D2R, R=1/mx;
    if(ang<15)continue;
    let gr=R>=T[0]?1:R>=T[1]?2:R>=T[2]?3:R>=T[3]?4:R>=T[4]?5:R>=T[5]?6:7;
    if(ang>=150&&R<25*cal)gr=7;
    if(gr===1&&ang<22)continue;
    const Lg=(g.e-g.s)*STEP,mods=[];
    if(Lg>=200)mods.push('vlong');else if(Lg>=100)mods.push('long');
    if(Lg>=40&&gr<7){
      const th=Math.max(1,Math.floor((g.e-g.s+1)/3));let a=0,b=0;
      for(let i=0;i<th;i++){a+=Math.abs(K[g.s+i]);b+=Math.abs(K[g.e-i]);}
      if(b>a*1.6)mods.push('tightens');else if(a>b*1.6)mods.push('opens');
    }
    notes.push({s:g.s*STEP,e:g.e*STEP,a:ap*STEP,dir:g.sg>0?'L':'R',g:gr,R:Math.round(R),ang:Math.round(ang),mods});
  }
  return linkNotes(notes,rt.total);
}
function roundDist(d){if(d<=500){const Ls=[30,50,70,100,150,200,250,300,350,400,500];return Ls.reduce((a,b)=>Math.abs(b-d)<Math.abs(a-d)?b:a);}return Math.round(d/100)*100;}
function linkNotes(notes,total){
  notes.forEach(n=>{n.mods=(n.mods||[]).map(m=>MOD_ES[m]||m).filter(m=>MODK.includes(m));});
  notes.sort((a,b)=>a.s-b.s);
  notes.forEach((nt,i)=>{const nx=notes[i+1];const gap=(nx?nx.s:total)-nt.e;nt.gap=Math.max(0,Math.round(gap));nt.gw=nx?(gap<20?'y':String(roundDist(gap))):'meta';});
  return notes;
}

const Voice={muted:false,voices:[],last:'',
  load(){if(!('speechSynthesis'in window))return;try{this.all=speechSynthesis.getVoices();}catch(e){this.all=[];}this.filter();},
  filter(){const p=cfg.lang;this.voices=(this.all||[]).filter(v=>(v.lang||'').toLowerCase().startsWith(p));fillVoices();},
  pick(){const V=VLANG[cfg.lang];return this.voices.find(v=>v.voiceURI===cfg.voice)||this.voices.find(v=>(v.lang||'').replace('_','-')===V)||this.voices[0]||null;},
  say(txt,flush){Voice.last=txt;if(this.muted||!('speechSynthesis'in window)||!txt)return;try{const u=new SpeechSynthesisUtterance(txt);u.lang=VLANG[cfg.lang];const v=this.pick();if(v)u.voice=v;u.rate=+cfg.rate||1.1;if(flush)speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}},
  unlock(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
};

let db=null,me=null;
const useFb=!!(FIREBASE_CONFIG&&window.firebase);
const LS_KEY='wt_stages';
const Store={
  async list(all){
    if(!useFb)return JSON.parse(localStorage.getItem(LS_KEY)||'[]');
    const q=all?db.collection('stages'):db.collection('stages').where('uid','==',me.uid);
    const snap=await q.get();return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async save(st){
    st.updatedAt=Date.now();if(!st.createdAt)st.createdAt=st.updatedAt;
    if(!useFb){const arr=JSON.parse(localStorage.getItem(LS_KEY)||'[]');if(!st.id)st.id='l'+Date.now();const i=arr.findIndex(x=>x.id===st.id);if(i>=0)arr[i]=st;else arr.push(st);localStorage.setItem(LS_KEY,JSON.stringify(arr));return st.id;}
    const data={...st};delete data.id;
    if(st.id){await db.collection('stages').doc(st.id).set(data);return st.id;}
    data.uid=me.uid;data.owner=me.name||me.email;st.uid=data.uid;st.owner=data.owner;
    const r=await db.collection('stages').add(data);return r.id;
  },
  async del(id){
    if(!useFb){localStorage.setItem(LS_KEY,JSON.stringify(JSON.parse(localStorage.getItem(LS_KEY)||'[]').filter(x=>x.id!==id)));return;}
    await db.collection('stages').doc(id).delete();
  }
};

const maps={};
function makeMap(id){
  if(maps[id])return maps[id];
  if(!window.L){$('#'+id).innerHTML=`<div class="empty">${t('mapFail')}</div>`;return null;}
  const m=L.map(id,{zoomControl:true,attributionControl:true}).setView([40.4,-3.7],6);
  const dark=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'});
  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
  (cfg.theme==='light'?osm:dark).addTo(m);
  m._base={dark,osm,sat};
  L.control.layers({'Dark':dark,'Map':osm,'Satellite':sat},null,{position:'topright'}).addTo(m);
  maps[id]=m;return m;
}
const flagIcon=()=>L.divIcon({className:'',html:'<div class="flag-ic"></div>',iconSize:[28,28],iconAnchor:[14,14]});
const startIcon=()=>L.divIcon({className:'',html:'<div class="wp-ic">S</div>',iconSize:[26,26],iconAnchor:[13,13]});
const meIcon=()=>L.divIcon({className:'',html:'<div class="me-ic"></div>',iconSize:[18,18],iconAnchor:[9,9]});
async function geocode(q){const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=${cfg.lang}&q=`+encodeURIComponent(q));return r.json();}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error(t('noGps')));navigator.geolocation.getCurrentPosition(p=>res([p.coords.latitude,p.coords.longitude]),()=>rej(new Error(t('locFail'))),{enableHighAccuracy:true,timeout:10000,maximumAge:5000});});}
async function osrm(pts,steps){
  const q=pts.map(p=>`${p[1].toFixed(6)},${p[0].toFixed(6)}`).join(';');
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${q}?overview=full&geometries=geojson${steps?'&steps=true':''}`);
  const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw new Error(t('routeErr'));
  const rt=j.routes[0];
  const mans=[];if(steps)for(const lg of rt.legs)for(const s of lg.steps){const m=s.maneuver;mans.push({ll:[m.location[1],m.location[0]],type:m.type,mod:m.modifier||'',exit:m.exit||0,name:s.name||s.ref||''});}
  return {pts:rt.geometry.coordinates.map(c=>[c[1],c[0]]),dist:rt.distance,dur:rt.duration,mans};
}

/* =========================================================
   NAVEGADOR — configuración del destino
   ========================================================= */
const Nav={dest:null,res:null,layers:[],seq:0,busy:false,
  init(){
    const m=makeMap('mapNav');if(!m)return;
    if(!this.bound){this.bound=1;m.on('click',e=>this.setDest([e.latlng.lat,e.latlng.lng]));}
    this.clear();
    getPos().then(p=>{this.here=p;m.setView(p,14);this.drawMe();}).catch(()=>{});
  },
  clear(){this.dest=null;this.res=null;this.layers.forEach(l=>l.remove());this.layers=[];$('#nvResults').classList.add('hidden');this.info();},
  drawMe(){if(this.meMk)this.meMk.remove();if(this.here&&maps.mapNav)this.meMk=L.marker(this.here,{icon:meIcon()}).addTo(maps.mapNav);},
  async setDest(p,label){
    this.dest=p;this.label=label||'';this.layers.forEach(l=>l.remove());this.layers=[L.marker(p,{icon:flagIcon()}).addTo(maps.mapNav)];
    this.busy=true;this.info();const seq=++this.seq;
    try{
      if(!this.here)this.here=await getPos();this.drawMe();
      const r=await osrm([this.here,p],true);if(seq!==this.seq)return;
      this.res=r;this.layers.push(L.polyline(r.pts,{color:'#ff5a00',weight:6,opacity:.9}).addTo(maps.mapNav));
      maps.mapNav.fitBounds(this.layers[1].getBounds(),{padding:[30,30]});
    }catch(e){if(seq===this.seq){this.res=null;toast(e.message,'bad');}}
    if(seq===this.seq){this.busy=false;this.info();}
  },
  info(){
    $('#nvInfo').textContent=this.busy?t('calc'):this.res?t('navInfo',{d:fmtKm(this.res.dist),t:fmtMin(this.res.dur)}):t('navInfo0');
    ['#nvGo','#nvSim','#nvSave'].forEach(s=>$(s).disabled=!this.res||this.busy);
  },
  data(){const rt=buildRoute(this.res.pts,'nav');const notes=computeNotes(rt);return {rt,pts:rt.pts,notes,mans:prepMans(rt,this.res.mans,notes),dest:this.dest,name:this.label};},
  async reroute(lat,lon){
    if(this.rerouting)return;this.rerouting=true;Voice.say(L_().sp.reroute,true);$('#drGps').textContent=t('rerouting');
    try{const r=await osrm([[lat,lon],Drive.d.dest],true);this.res=r;const d=this.data();Drive.load(d,true);}
    catch(e){toast(e.message,'bad');}
    this.rerouting=false;
  }
};
function prepMans(rt,mans,notes){
  const out=[];
  for(const m of mans){
    if(m.type==='depart')continue;
    if((m.type==='new name'||m.type==='continue'||m.type==='notification')&&(!m.mod||m.mod==='straight'))continue;
    const s=m.type==='arrive'?rt.total:nearestS(rt,m.ll[0],m.ll[1]);
    out.push({...m,s,far:false,near:false});
  }
  // las notas que coinciden con un cruce/rotonda las sustituye la indicación
  for(const m of out){if(m.type==='arrive')continue;notes.forEach(n=>{if(n.e>=m.s-25&&n.s<=m.s+25)n.nav=true;});}
  return out.sort((a,b)=>a.s-b.s);
}
function manText(m){
  const M=L_().man;
  if(m.type==='arrive')return M.arrive;
  let base;
  if(m.type==='roundabout'||m.type==='rotary'||m.type==='roundabout turn')base=fmt(M.round,{n:m.exit||1});
  else base=M[m.mod]||M.straight;
  return base+(m.name&&m.type!=='roundabout'&&m.type!=='rotary'?fmt(M.onto,{s:m.name}):'');
}
function manIcon(m){
  if(m.type==='arrive')return 'FIN';
  if(/round|rotary/.test(m.type))return 'RB';
  return {right:'R',left:'L','sharp right':'R','sharp left':'L','slight right':'SR','slight left':'SL',uturn:'UT'}[m.mod]||'ST';
}
async function navSearch(){
  const q=$('#nvSearch').value.trim();if(!q)return;
  try{const j=await geocode(q);const box=$('#nvResults');
    if(!j.length){box.classList.add('hidden');return toast(t('notFound'));}

   EDITOR EN MAPA
   ========================================================= */
const Ed={wps:[],markers:[],line:null,geom:null,busy:false,seq:0,
  init(){
    const m=makeMap('mapEd');if(!m)return;
    if(!this.bound){this.bound=1;m.on('click',e=>this.add([e.latlng.lat,e.latlng.lng]));}
    this.clear();getPos().then(p=>m.setView(p,13)).catch(()=>{});
  },
  add(p){this.wps.push(p);this.draw();this.route();},
  undo(){this.wps.pop();this.draw();this.route();},
  clear(){this.wps=[];this.geom=null;this.draw();},
  draw(){
    const m=maps.mapEd;if(!m)return;
    this.markers.forEach(x=>x.remove());this.markers=[];
    this.wps.forEach((p,i)=>{const fin=i===this.wps.length-1&&i>0;
      const mk=L.marker(p,{draggable:true,icon:fin?flagIcon():L.divIcon({className:'',html:`<div class="wp-ic">${i===0?'S':i}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(m);
      mk.on('dragend',()=>{const ll=mk.getLatLng();this.wps[i]=[ll.lat,ll.lng];this.route();});this.markers.push(mk);});
    if(this.line&&this.wps.length<2){this.line.remove();this.line=null;}
    this.info();
  },
  info(){
    const n=this.wps.length;
    $('#edInfo').textContent=this.busy?t('calc'):n===0?t('edInfo0'):n===1?t('edInfo1'):this.geom?t('edRoute',{d:fmtKm(this.geom.dist),n}):t('noRoute');
    $('#edGen').disabled=!this.geom||this.busy;
  },
  async route(){
    if(this.wps.length<2){this.geom=null;this.info();return;}
    this.busy=true;this.info();const seq=++this.seq;
    try{const r=await osrm(this.wps,false);if(seq!==this.seq)return;this.geom=r;
      if(this.line)this.line.remove();this.line=L.polyline(r.pts,{color:'#ff5a00',weight:5,opacity:.9}).addTo(maps.mapEd);}
    catch(e){if(seq===this.seq){this.geom=null;toast(e.message,'bad');}}
    if(seq===this.seq){this.busy=false;this.info();}
  }
};
$('#edUndo').onclick=()=>Ed.undo();
$('#edClear').onclick=()=>Ed.clear();
$('#edGen').onclick=()=>{if(Ed.geom)newStage(t('stageName')+' '+new Date().toLocaleDateString(VLANG[cfg.lang]),'map',Ed.geom.pts);};

async function edSearch(){const q=$('#edSearch').value.trim();if(!q)return;try{const j=await geocode(q);if(!j.length)return toast(t('notFound'));maps.mapEd.setView([+j[0].lat,+j[0].lon],14);}catch(e){toast(t('searchErr'),'bad');}}

/* =========================================================
   GRABACIÓN DE RECONOCIMIENTO
   ========================================================= */
const Rec={pts:[],watch:null,state:'idle',t0:0,elapsed:0,times:[],line:null,me:null,timer:null,
  init(){const m=makeMap('mapRec');this.reset();if(m)getPos().then(p=>m.setView(p,16)).catch(()=>{});this.startWatch();},
  reset(){this.pts=[];this.state='idle';this.elapsed=0;this.times=[];if(this.line){this.line.remove();this.line=null;}this.ui();},
  startWatch(){
    if(!navigator.geolocation){$('#rcGps').textContent=t('noGps');return;}
    if(this.watch!==null)return;
    this.watch=navigator.geolocation.watchPosition(p=>this.fix(p),e=>{$('#rcGps').textContent=t('err');$('#rcState').textContent='GPS: '+e.message;},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  },
  fix(p){
    const now=Date.now();this.times.push(now);this.times=this.times.filter(x=>now-x<5000);
    const acc=p.coords.accuracy,ll=[p.coords.latitude,p.coords.longitude];
    $('#rcGps').textContent=t(acc<=15?'good':acc<=30?'fair':'bad');$('#rcGps').style.color=acc<=15?'var(--ok)':acc<=30?'var(--warn)':'var(--bad)';
    $('#rcAcc').textContent=Math.round(acc)+' m';$('#rcHz').textContent=(this.times.length/5).toFixed(1)+' Hz';
    const m=maps.mapRec;
    if(m){if(!this.me)this.me=L.marker(ll,{icon:meIcon()}).addTo(m);else this.me.setLatLng(ll);}
    if(this.state!=='rec'||acc>30)return;
    const last=this.pts[this.pts.length-1];if(last&&hav(last,ll)<3)return;
    this.pts.push(ll);
    if(m){if(!this.line)this.line=L.polyline(this.pts,{color:'#ff5a00',weight:5}).addTo(m);else this.line.setLatLngs(this.pts);m.panTo(ll,{animate:false});}
    this.ui();
  },
  dist(){let d=0;for(let i=1;i<this.pts.length;i++)d+=hav(this.pts[i-1],this.pts[i]);return d;},
  ui(){
    $('#rcPts').textContent=this.pts.length;$('#rcDist').textContent=fmtKm(this.dist());
    const el=this.elapsed+(this.state==='rec'?Date.now()-this.t0:0),s=Math.floor(el/1000);$('#rcTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    $('#rcStart').classList.toggle('hidden',this.state==='rec');
    $('#rcStartT').textContent=this.state==='paused'?t('resume'):t('startB');
    $('#rcPause').classList.toggle('hidden',this.state!=='rec');
    $('#rcStop').classList.toggle('hidden',this.state==='idle');
    $('#rcState').textContent=this.state==='rec'?t('recOn'):this.state==='paused'?t('paused'):t('recReady');
  },
  start(){this.startWatch();this.state='rec';this.t0=Date.now();clearInterval(this.timer);this.timer=setInterval(()=>this.ui(),1000);this.ui();},
  pause(){this.elapsed+=Date.now()-this.t0;this.state='paused';clearInterval(this.timer);this.ui();},
  stop(silent){
    if(this.state==='rec')this.elapsed+=Date.now()-this.t0;
    clearInterval(this.timer);if(this.watch!==null){navigator.geolocation.clearWatch(this.watch);this.watch=null;}
    if(this.me){this.me.remove();this.me=null;}
    const pts=this.pts.slice(),dist=this.dist();this.state='idle';
    if(silent)return;
    if(pts.length<10||dist<100)return toast(t('tooShort'),'bad');
    newStage(t('recName')+' '+new Date().toLocaleDateString(VLANG[cfg.lang]),'rec',pts);
  }
};
$('#rcStart').onclick=()=>Rec.start();
$('#rcPause').onclick=()=>Rec.pause();
$('#rcStop').onclick=()=>Rec.stop(false);

/* =========================================================
   MODO COPILOTO / NAVEGADOR (GPS o simulación)
   modos: gps · sim · nav · navsim
   ========================================================= */
const Drive={
  open(mode,data){
    if(!data.notes.length&&!data.mans.length)return toast(t('noNotes'),'bad');
    this.on=true;this.mode=mode;this.nav=mode==='nav'||mode==='navsim';this.sim=mode==='sim'||mode==='navsim';
    this.running=false;this.done=false;this.fixTimes=[];
    $('#scr-drive').classList.add('act');
    $('#drMode').textContent=this.sim?t('simMode'):this.nav?t('navMode'):'GPS';$('#drMode').className='pill '+(this.sim?'warn':'ok');
    $('#drSimBar').classList.toggle('hidden',!this.sim);
    $('#drGps').className='pill'+(this.sim?' hidden':'');$('#drGps').textContent=t('seekGps');
    $('#drLeftL').textContent=t(this.nav?'toDest':'toFinish');
    this.load(data,false);
    if(!this.sim)this.startGps();
    this.setGo(t('go'),'play');
  },
  load(data,keep){
    this.d=data;this.rt=data.rt;this.notes=data.notes.filter(n=>!n.nav);this.mans=data.mans||[];
    this.s=0;this.idx=0;this.nextAnn=0;this.off=false;this.offN=0;this.lastFix=null;if(!keep)this.v=0;
    $('#drOff').classList.add('hidden');
    const m=makeMap('mapDr');
    if(m){
      (this.layers||[]).forEach(l=>l.remove());
      this.layers=[L.polyline(data.pts,{color:'#ff5a00',weight:6}).addTo(m),L.marker(data.pts[data.pts.length-1],{icon:flagIcon()}).addTo(m)];
      this.me=L.marker(data.pts[0],{icon:meIcon()}).addTo(m);this.layers.push(this.me);
      setTimeout(()=>{m.invalidateSize();m.setView(data.pts[0],16);},60);
    }
    this.update();
  },
  setGo(txt,i){$('#drGo').innerHTML=ic(i)+esc(txt);},
  startGps(){
    if(!navigator.geolocation){$('#drGps').textContent=t('noGps');return;}
    this.watch=navigator.geolocation.watchPosition(p=>this.onFix(p.coords.latitude,p.coords.longitude,p.coords.speed,p.coords.accuracy),e=>{$('#drGps').textContent='GPS: '+e.message;$('#drGps').className='pill bad';},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  },
  async go(){
    Voice.unlock();
    if(this.done){this.load(this.d,false);this.done=false;}
    if(this.running){this.running=false;this.setGo(t('resumeB'),'play');clearInterval(this.simT);try{speechSynthesis.cancel();}catch(e){}return;}
    this.running=true;this.setGo(t('pauseB'),'pause');
    try{this.wake=await navigator.wakeLock?.request('screen');}catch(e){}
    if(this.s<5&&this.nextAnn===0){
      if(this.nav)Voice.say(L_().sp.navStart,true);
      else{const n0=this.notes[0];Voice.say(`${L_().sp.start}. ${roundDist(Math.max(30,n0.s-this.s))}`,true);}
    }
    if(this.sim){this.lastT=performance.now();clearInterval(this.simT);this.simT=setInterval(()=>this.simTick(),100);}
  },
  simTick(){
    const now=performance.now(),dt=Math.min(.3,(now-this.lastT)/1000);this.lastT=now;
    const want=(+$('#drSimSpd').value)/3.6;
    let rmin=1e9;const look=Math.max(40,this.v*3);for(let d=0;d<=look;d+=STEP)rmin=Math.min(rmin,radiusAt(this.rt,this.s+d));
    let tgt=Math.min(want,Math.sqrt(7*rmin));
    if(this.nav){const m=this.mans.find(x=>x.s>this.s-5&&x.type!=='arrive');if(m&&m.s-this.s<80&&manIcon(m)!=='ST'&&manIcon(m)!=='SR'&&manIcon(m)!=='SL')tgt=Math.min(tgt,6+(m.s-this.s)*0.12);}
    this.v+=Math.max(-7*dt,Math.min(3.5*dt,tgt-this.v));this.v=Math.max(3,this.v);
    const s=Math.min(this.rt.total,this.s+this.v*dt);const p=posAt(this.rt,s);
    this.onFix(p[0],p[1],this.v,5,s);
  },
  match(x,y){
    const rt=this.rt;let best=1e12,bi=0,bt=0;
    const scan=(a,b)=>{for(let i=a;i<b;i++){const ax=rt.X[i],ay=rt.Y[i],dx=rt.X[i+1]-ax,dy=rt.Y[i+1]-ay;const L2=dx*dx+dy*dy||1;let u=((x-ax)*dx+(y-ay)*dy)/L2;u=Math.max(0,Math.min(1,u));const ex=ax+dx*u-x,ey=ay+dy*u-y,d=ex*ex+ey*ey;if(d<best){best=d;bi=i;bt=u;}}};
    scan(Math.max(0,this.idx-20),Math.min(rt.n-1,this.idx+200));
    if(best>80*80)scan(0,rt.n-1);
    return {s:(bi+bt)*STEP,d:Math.sqrt(best),i:bi};
  },
  onFix(lat,lon,spd,acc,simS){
    const now=Date.now();this.fixTimes.push(now);this.fixTimes=this.fixTimes.filter(x=>now-x<5000);
    if(!this.sim&&!Nav.rerouting){$('#drGps').textContent=`GPS ±${Math.round(acc)} m · ${(this.fixTimes.length/5).toFixed(1)} Hz`;$('#drGps').className='pill '+(acc<=15?'ok':acc<=30?'warn':'bad');}
    if(this.me)this.me.setLatLng([lat,lon]);if(maps.mapDr)maps.mapDr.panTo([lat,lon],{animate:false});
    if(!this.running)return;
    let s,d=0;
    if(simS!=null)s=simS;
    else{const [x,y]=this.rt.toXY(lat,lon);const m=this.match(x,y);s=m.s;d=m.d;
      const v=spd!=null&&spd>=0?spd:(this.lastFix?Math.abs(s-this.lastFix.s)/Math.max(.2,(now-this.lastFix.t)/1000):0);
      this.v=this.v*0.5+v*0.5;this.lastFix={s,t:now};}
    const off=d>50;
    this.offN=off?this.offN+1:0;
    if(off!==this.off){this.off=off;$('#drOff').classList.toggle('hidden',!off);if(off&&!this.nav)Voice.say(L_().sp.off,true);}
    if(off&&this.nav&&this.offN>=3&&(!this.lastRR||now-this.lastRR>10000)){this.lastRR=now;Nav.reroute(lat,lon);return;}
    if(!off&&(simS!=null||s>=this.s-30))this.s=s;
    this.idx=Math.floor(this.s/STEP);
    this.announce();this.update();
    if(this.s>=this.rt.total-(this.nav?20:10)&&!this.done){this.done=true;this.running=false;clearInterval(this.simT);Voice.say(this.nav?L_().sp.arrived:L_().sp.done,false);this.setGo(t('repeat'),'repeat');try{this.wake?.release();}catch(e){}}
  },
  announce(){
    const v=this.v,S=L_().sp;
    // indicaciones del navegador
    if(this.nav)for(const m of this.mans){
      if(m.type==='arrive')continue;
      const d=m.s-this.s;if(d<-10){m.far=m.near=true;continue;}
      const nearD=Math.max(40,v*3.5),farD=Math.max(250,v*11);
      if(!m.near&&d<=nearD){m.near=m.far=true;Voice.say(manText(m),false);}
      else if(!m.far&&d<=farD&&d>nearD+40){m.far=true;Voice.say(fmt(S.inD,{d:roundDist(d),m:manText(m)}),false);}
    }
    // notas de curva (en navegador se callan por debajo de 25 km/h)
    const lead=Math.max(60,v*(+cfg.lead||5)),N=this.notes;
    while(this.nextAnn<N.length){
      const n=N[this.nextAnn];
      if(n.e<this.s){this.nextAnn++;continue;}
      if(n.s-this.s>lead)break;
      let j=this.nextAnn;const parts=[noteSpeech(N[j])];
      while(N[j].gw==='y'&&j+1<N.length){j++;parts.push(S.and+' '+noteSpeech(N[j]));}
      const last=N[j];
      if(last.gw==='meta'){if(!this.nav&&last.gap<=500)parts.push(roundDist(Math.max(30,last.gap))+', '+S.finish);}
      else parts.push(last.gw);
      if(!(this.nav&&v<7))Voice.say(parts.join(', '),false);
      this.nextAnn=j+1;
    }
  },
  update(){
    const N=this.notes;const k=N.findIndex(n=>n.e>=this.s);
    const box=$('#drNote');
    if(k<0){box.className='bignote idle';box.innerHTML=`<div><div class="gr h">${this.done||this.s>0?t('finishW'):t('ready')}</div></div>`;$('#drDist').innerHTML=fmtKm(Math.max(0,this.rt.total-this.s));$('#drNext').innerHTML='';}
    else{
      const n=N[k],d=n.s-this.s;
      box.className='bignote c'+n.g;
      const md=[n.mods.includes('caution')?'¡'+modTxt('caution')+'!':'',...n.mods.filter(m=>m!=='caution').map(modTxt)].filter(Boolean).join(' · ')||t(n.dir==='L'?'dirL':'dirR');
      box.innerHTML=`<div class="arr">${arrowIcon(n)}</div><div><div class="gr${n.g===7?' h':''}">${n.g===7?esc(L_().sp.hp):gLabel(n.g)}</div><div class="md">${esc(md)}</div></div>`;
      $('#drDist').innerHTML=d>0?`${Math.round(d)}<small> m</small>`:t('inCurve');
      const nx=N[k+1];
      $('#drNext').innerHTML=nx?`<span class="pill">${n.gw==='y'?esc(gapTxt(n)):n.gw+' m'}</span><span class="gb c${nx.g}">${arrowIcon(nx)}${gLabel(nx.g)}</span><span>${esc(nx.mods.map(modTxt).join(' · '))}</span>`:`<span class="pill">${n.gap} m</span><span>${t('finishW')}</span>`;
    }
    // banner de indicación
    const mb=$('#drMan');
    const m=this.nav&&this.mans.find(x=>x.s>=this.s-10);
    if(m){mb.classList.remove('hidden');$('#drManAr').innerHTML=ic(manIcon(m));$('#drManD').textContent=fmtKm(Math.max(0,m.s-this.s));const tx=manText(m);$('#drManT').textContent=tx.charAt(0).toUpperCase()+tx.slice(1);}
    else mb.classList.add('hidden');
    $('#drSpd').textContent=Math.round((this.v||0)*3.6)+' km/h';
    $('#drLeft').textContent=fmtKm(Math.max(0,this.rt.total-this.s));
    $('#drIdx').textContent=!N.length?'—':k<0?`${N.length}/${N.length}`:`${k+1}/${N.length}`;
    $('#drProg').style.width=Math.min(100,this.s/this.rt.total*100)+'%';
  },
  close(){
    this.on=false;this.running=false;clearInterval(this.simT);if(this.watch!=null){navigator.geolocation.clearWatch(this.watch);this.watch=null;}
    try{speechSynthesis.cancel();}catch(e){}try{this.wake?.release();}catch(e){}
    $('#scr-drive').classList.remove('act');setTimeout(()=>Object.values(maps).forEach(m=>m&&m.invalidateSize()),60);
  }
};
$('#drGo').onclick=()=>Drive.go();
$('#drExit').onclick=()=>Drive.close();
$('#drRepeat').onclick=()=>{if(Voice.last)Voice.say(Voice.last,true);};
$('#drMute').onclick=()=>{Voice.muted=!Voice.muted;if(Voice.muted)try{speechSynthesis.cancel();}catch(e){}const b=$('#drMute');b.innerHTML=ic(Voice.muted?'mute':'vol');b.classList.toggle('on',Voice.muted);};
$('#drSimSpd').oninput=()=>$('#drSimVal').textContent=$('#drSimSpd').value+' km/h';
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&Drive.running){try{Drive.wake=await navigator.wakeLock?.request('screen');}catch(e){}}});

/* =========================================================
   AJUSTES
   ========================================================= */
function fillVoices(){const s=$('#setVoice');if(!s)return;s.innerHTML=`<option value="">${t('autoVoice')}</option>`+Voice.voices.map(v=>`<option value="${esc(v.voiceURI)}"${v.voiceURI===cfg.voice?' selected':''}>${esc(v.name)} (${v.lang})</option>`).join('');}
function openSettings(){
  [['#setScale','scale'],['#setCalib','calib']].forEach(([sel,key])=>$$(sel+' button').forEach(b=>{b.classList.toggle('on',String(cfg[key])===b.dataset.v);b.onclick=()=>{cfg[key]=key==='calib'?+b.dataset.v:b.dataset.v;saveCfg();openSettings();if(ST&&curScr==='scr-stage'&&key==='scale')renderStage(false);};}));
  $('#setLead').value=cfg.lead;$('#setLeadV').textContent=cfg.lead+' s';
  $('#setRate').value=cfg.rate;$('#setRateV').textContent='×'+(+cfg.rate).toFixed(2);
  fillVoices();$('#ovSet').classList.remove('hidden');
}
$('#setLead').oninput=e=>{cfg.lead=+e.target.value;$('#setLeadV').textContent=cfg.lead+' s';saveCfg();};
$('#setRate').oninput=e=>{cfg.rate=+e.target.value;$('#setRateV').textContent='×'+cfg.rate.toFixed(2);saveCfg();};
$('#setVoice').onchange=e=>{cfg.voice=e.target.value;saveCfg();};
$('#setTest').onclick=()=>Voice.say(L_().sp.test,true);
$('#setOk').onclick=()=>$('#ovSet').classList.add('hidden');
$('#ovSet').onclick=e=>{if(e.target.id==='ovSet')$('#ovSet').classList.add('hidden');};
$('#btnSettings').onclick=openSettings;

/* =========================================================
   INICIO / LOGIN / USUARIOS / ADMIN
   ========================================================= */
const isAdmin=()=>me&&me.role==='admin';
let authReady=false;
$('#lnGo').onclick=()=>{if(!useFb){show('scr-home');return;}show(me?'scr-home':'scr-login');};
async function initAuth(){
  if(!useFb){me={uid:'local',name:'Local',role:'user'};$('#localBar').classList.remove('hidden');show('scr-landing');return;}
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  show('scr-landing');
  firebase.auth().onAuthStateChanged(async u=>{
    const first=!authReady;authReady=true;
    if(!u){me=null;$('#btnLogout').classList.add('hidden');$('#btnAdmin').classList.add('hidden');if(!first)show('scr-landing');return;}
    try{
      const ref=db.collection('users').doc(u.uid);let snap=await ref.get();
      if(!snap.exists){const adm=ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((u.email||'').toLowerCase());await ref.set({name:u.email.split('@')[0],email:u.email,role:adm?'admin':'user',active:true,createdAt:Date.now()});snap=await ref.get();}
      const d=snap.data();
      if(d.active===false){await firebase.auth().signOut();show('scr-login');$('#lgErr').textContent=t('userOff');return;}
      me={uid:u.uid,email:u.email,...d};
      $('#btnLogout').classList.remove('hidden');$('#btnAdmin').classList.toggle('hidden',!isAdmin());
      if(curScr==='scr-login'||!first)show('scr-home');
    }catch(e){$('#lgErr').textContent=e.message;}
  });
}
$('#lgBtn').onclick=async()=>{
  $('#lgErr').textContent='';const em=$('#lgEmail').value.trim(),pw=$('#lgPass').value;
  if(!em||!pw)return $('#lgErr').textContent=t('needCreds');
  try{await firebase.auth().setPersistence($('#lgRemember').checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);await firebase.auth().signInWithEmailAndPassword(em,pw);show('scr-home');}
  catch(e){$('#lgErr').textContent=/invalid|wrong|not-found|credential/i.test(e.code||'')?t('badCreds'):e.message;}
};
$('#lgPass').onkeydown=e=>{if(e.key==='Enter')$('#lgBtn').click();};
$('#lgReset').onclick=async()=>{const em=$('#lgEmail').value.trim();if(!em)return $('#lgErr').textContent=t('writeEmail');try{await firebase.auth().sendPasswordResetEmail(em);toast(t('resetMail'),'ok');}catch(e){$('#lgErr').textContent=e.message;}};
$('#btnLogout').onclick=()=>{if(confirm(t('logoutQ')))firebase.auth().signOut();};
$('#btnAdmin').onclick=()=>{show('scr-admin');renderAdmin();};
$$('.tab').forEach(tb=>tb.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===tb));$('#admUsers').classList.toggle('hidden',tb.dataset.tab!=='users');$('#admStages').classList.toggle('hidden',tb.dataset.tab!=='stages');renderAdmin();});
async function renderAdmin(){
  if(!isAdmin()||!db)return;
  try{
    const us=(await db.collection('users').get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    $('#admUserList').innerHTML=us.map(u=>`<div class="urow"><div class="ic">${ic(u.role==='admin'?'gear':'users')}</div><div class="t"><b>${esc(u.name)}</b><span>${esc(u.email)} · ${t(u.role==='admin'?'adminR':'pilot')}${u.active===false?` · <span style="color:var(--bad)">${t('disabled')}</span>`:''}</span></div>${u.id!==me.uid?`<button class="btn sm" data-act="role" data-id="${u.id}">${t(u.role==='admin'?'makePilot':'makeAdmin')}</button><button class="btn sm${u.active===false?'':' bad'}" data-act="act" data-id="${u.id}">${t(u.active===false?'activate':'deact')}</button>`:''}<button class="btn sm" data-act="reset" data-id="${u.id}" title="${esc(t('forgot'))}">${ic('mail')}</button></div>`).join('')||`<div class="empty" style="border:0">${t('noUsers')}</div>`;
    $$('#admUserList [data-act]').forEach(b=>b.onclick=async()=>{
      const u=us.find(x=>x.id===b.dataset.id);
      try{
        if(b.dataset.act==='role')await db.collection('users').doc(u.id).update({role:u.role==='admin'?'user':'admin'});
        if(b.dataset.act==='act')await db.collection('users').doc(u.id).update({active:u.active===false});
        if(b.dataset.act==='reset'){await firebase.auth().sendPasswordResetEmail(u.email);toast(t('resetSent',{e:u.email}),'ok');}
        renderAdmin();
      }catch(e){toast(e.message,'bad');}
    });
    const ss=(await Store.list(true)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    $('#admStageList').innerHTML=ss.length?ss.map(s=>`<div class="stage" data-id="${s.id}"><div class="ic">${ic('route')}</div><div class="t"><b>${esc(s.name)}</b><span>${esc(s.owner||'')} · ${fmtKm(s.total||0)} · ${(s.notes||[]).length} ${t('curves')} · ${fmtDate(s.updatedAt)}</span></div></div>`).join(''):`<div class="empty">${t('noStages')}</div>`;
    $$('#admStageList .stage').forEach(el=>el.onclick=()=>openStage(ss.find(s=>s.id===el.dataset.id)));
  }catch(e){toast(e.message,'bad');}
}
$('#nuBtn').onclick=async()=>{
  const name=$('#nuName').value.trim(),email=$('#nuEmail').value.trim(),pass=$('#nuPass').value,role=$('#nuRole').value;
  if(!name||!email||pass.length<6)return toast(t('fillAll'),'bad');
  $('#nuBtn').disabled=true;
  try{
    const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
    const cred=await sec.auth().createUserWithEmailAndPassword(email,pass);
    await db.collection('users').doc(cred.user.uid).set({name,email,role,active:true,createdAt:Date.now()});
    await sec.auth().signOut();
    toast(t('userCreated',{n:name}),'ok');$('#nuName').value=$('#nuEmail').value=$('#nuPass').value='';renderAdmin();
  }catch(e){toast(/email-already/.test(e.code||'')?t('emailUsed'):e.message,'bad');}
  $('#nuBtn').disabled=false;
};

paintIcons();applyTheme();applyLang();initAuth();
window.__T={buildRoute,computeNotes,newStage,Drive,Nav,prepMans,get ST(){return ST;},cfg,Voice,applyLang,show};
